<title>Ritsu</title>
<style>
  :root{

    --shadow:0 22px 50px -24px rgba(0,0,0,.7); --shadow-sm:0 1px 0 rgba(0,0,0,.2);

  }
  :root[data-theme="warm"]{
    --bg:#EDE6D8; --panel:#F7F2E9; --panel-2:#F1EADD; --raise:#FBF7EF;
    --ink:#2A2521; --muted:#8B8173; --faint:#B4A995; --line:#E2D8C6; --line-2:#EDE4D4;
    --accent:#3F6B54; --accent-soft:#3f6b5418; --accent-ink:#345c48; --on-accent:#FBF7EF;
    --gold:#A9781F; --gold-soft:#a9781f18; --rust:#B0503A; --rust-soft:#b0503a14; --good:#3F6B54; --good-soft:#3f6b5416;
    --shadow:0 18px 40px -22px rgba(60,45,20,.3); --shadow-sm:0 2px 0 rgba(120,100,60,.05);
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}

  .serif{font-family:var(--serif)}

  .sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;padding:22px 14px;border-right:1px solid var(--line);overflow-y:auto}
  .brand{display:flex;align-items:baseline;gap:9px;padding:2px 8px 18px} .brand b{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:-.01em} .brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .nav-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:16px 10px 6px}
  .nav-btn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 11px;border:0;background:transparent;border-radius:10px;color:var(--muted);font-size:14.5px;font-weight:500;transition:.14s}
  .nav-btn .g{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
  .nav-btn:hover{background:var(--panel);color:var(--ink)} .nav-btn.active{background:var(--accent-soft);color:var(--accent-ink)} .nav-btn.active .g{background:var(--accent)}
  .nav-btn .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)} .nav-btn .count.warn{color:var(--gold)}
  .icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .add-cat{display:flex;align-items:center;gap:9px;width:100%;margin-top:4px;padding:9px 11px;border:1px dashed var(--line);background:transparent;border-radius:10px;color:var(--faint);font-size:13px;font-weight:500} .add-cat:hover{border-color:var(--accent);color:var(--accent-ink)}
  .me{margin-top:auto;padding-top:14px} .me-btn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--panel);border-radius:12px} .me-btn:hover{border-color:var(--accent)} .me-btn .who{display:flex;flex-direction:column;text-align:left;line-height:1.2;min-width:0} .me-btn .who small{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)} .me-btn .who b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .me-btn .chev{margin-left:auto;color:var(--faint)}

  .topbar{display:none} .bottomnav{display:none}

  .day-h .nav{display:flex;gap:6px} .day-h .nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:15px} .day-h .nav button:hover{color:var(--ink);border-color:var(--accent)}

  .day-h .prog{text-align:right;flex:none} .day-h .prog b{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1} .day-h .prog small{display:block;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-top:4px}
  .today-btn{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px} .today-btn:hover{border-color:var(--accent);color:var(--ink)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:13px;transition:.16s;position:relative;box-shadow:var(--shadow-sm)} .tile:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
  .tile .top{display:flex;align-items:center;gap:10px} .tile .sw{width:12px;height:12px;border-radius:4px;flex:none;background:var(--tc,var(--accent))} .tile h3{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0} .tile .pct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)} .tile .pct.warn{color:var(--gold)}
  .barwrap{height:6px;border-radius:20px;background:var(--panel-2);overflow:hidden} .barwrap>i{display:block;height:100%;border-radius:20px;background:var(--tc,var(--accent));transition:width .4s}
  .tile .subs{display:flex;flex-wrap:wrap;gap:5px;min-height:20px} .tile .subs span{font-family:var(--mono);font-size:10px;color:var(--faint)} .tile .subs span:not(:last-child):after{content:"·";margin-left:5px;color:var(--line)}
  .stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px} .schip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)} .schip b{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1;display:block} .schip small{font-size:12px;color:var(--muted)} .schip.warn b{color:var(--gold)} .schip.bad b{color:var(--rust)} .schip.good b{color:var(--good)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 18px;box-shadow:var(--shadow-sm)}
  .row{display:flex;align-items:flex-start;gap:13px;padding:14px 0;border-bottom:1px solid var(--line-2);cursor:pointer} .row:last-child{border-bottom:0}
  .tick{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;font-weight:600;color:transparent;background:transparent;transition:.13s} .tick.round{border-radius:50%} .tick:hover{border-color:var(--accent)} .tick.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .tick.part{border-color:var(--accent);color:var(--accent-ink)}
  .rb{flex:1;min-width:0} .rt{font-size:15px;font-weight:500;line-height:1.3;word-break:break-word;display:flex;align-items:center;gap:7px} .rt .lk{color:var(--faint);flex:none} .row.done .rt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
  .rmeta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:7px}
  .time{font-family:var(--mono);font-size:10.5px;color:var(--muted)} .time.accent{color:var(--accent-ink)}
  .tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted)} .tag .dot{width:7px;height:7px;border-radius:50%}
  .streak{font-family:var(--mono);font-size:10.5px;color:var(--gold);display:inline-flex;align-items:center;gap:4px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted)} .pill.rep{background:var(--accent-soft);color:var(--accent-ink)} .pill.hi{background:var(--rust-soft);color:var(--rust)} .pill.due.soon{background:var(--gold-soft);color:var(--gold)} .pill.due.over{background:var(--rust-soft);color:var(--rust)} .pill.warnflag{background:var(--rust-soft);color:var(--rust)}
  .rright{margin-left:auto;flex:none;display:flex;align-items:center;gap:11px;padding-left:6px} .days{font-family:var(--mono);font-size:12px;font-weight:500} .days.ok{color:var(--good)} .days.warn{color:var(--gold)} .days.bad{color:var(--rust)}
  .mini-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap} .mini-btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .mval{text-align:right} .mval b{font-family:var(--serif);font-weight:600;font-size:18px} .mval b.hit{color:var(--good)} .mval small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
  .avatars{display:flex} .avatars .av{margin-left:-6px;border:2px solid var(--panel)} .avatars .av:first-child{margin-left:0}
  .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none} .av.lg{width:30px;height:30px;font-size:13px} .av.sm{width:20px;height:20px;font-size:10px} .av.more{background:var(--panel-2);color:var(--muted);font-family:var(--mono);font-size:10px}
  .sub{margin-top:20px} .sub-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;padding-left:2px}
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px} .chip{font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:inline-flex;align-items:center;gap:6px} .chip:hover{color:var(--ink)} .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)} .chip .dot{width:7px;height:7px;border-radius:50%}
  .back{display:inline-flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--muted);font-size:13px;font-weight:600;padding:0;margin-bottom:12px} .back:hover{color:var(--ink)}
  .area-top{display:flex;align-items:center;gap:13px;margin-bottom:16px} .area-top .sw{width:16px;height:34px;border-radius:6px;flex:none;background:var(--tc,var(--accent))}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:13.5px;white-space:nowrap} .btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)} .btn.primary:hover{filter:brightness(1.06)} .btn.sm{padding:7px 12px;font-size:12.5px} .btn.ghost{background:transparent} .btn.danger{color:var(--rust);border-color:var(--rust-soft)} .btn.danger:hover{background:var(--rust-soft);border-color:var(--rust)}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0} .statbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;text-align:center;box-shadow:var(--shadow-sm)} .statbox b{display:block;font-family:var(--serif);font-weight:600;font-size:25px;line-height:1} .statbox small{font-size:11.5px;color:var(--muted)} .statbox.flame b{color:var(--gold)} .statbox.good b{color:var(--good)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)} .panel h4{font-family:var(--serif);font-weight:600;font-size:15px;margin:0 0 14px}
  .dots7{display:flex;gap:8px;flex-wrap:wrap} .dot7{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer} .dot7 .d{width:30px;height:30px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;font-size:12px;color:transparent;border:1px solid var(--line)} .dot7 .d.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .dot7:hover .d{border-color:var(--accent)} .dot7 small{font-family:var(--mono);font-size:9px;color:var(--faint);text-transform:uppercase}
  .heat{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px} .heatcol{display:flex;flex-direction:column;gap:4px} .heatcell{width:14px;height:14px;border-radius:4px;background:var(--panel-2);cursor:pointer;border:1px solid var(--line-2)} .heatcell.on{background:var(--accent);border-color:var(--accent)} .heatcell.fut{opacity:.3;cursor:default} .heatlbl{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:8px;display:flex;justify-content:space-between}
  .freq{display:flex;align-items:flex-end;gap:9px;height:76px} .freqbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end} .freqbar .fb{width:100%;max-width:26px;border-radius:6px 6px 0 0;background:var(--accent);min-height:3px} .freqbar small{font-family:var(--mono);font-size:9px;color:var(--faint)}
  .mbars{display:flex;align-items:flex-end;gap:6px;height:64px} .mbars .mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end} .mbars .mb i{width:100%;max-width:22px;border-radius:5px 5px 0 0;background:var(--panel-2);min-height:2px} .mbars .mb i.hit{background:var(--good)} .mbars .mb small{font-family:var(--mono);font-size:8.5px;color:var(--faint)}
  .rtabs{display:inline-flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px} .rtabs button{border:0;background:transparent;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 13px;border-radius:999px} .rtabs button.on{background:var(--raise);color:var(--ink);box-shadow:var(--shadow-sm)}
  .bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px} .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;min-width:0} .bars .b i{width:100%;max-width:38px;border-radius:6px 6px 3px 3px;background:var(--accent)} .bars .b i.low{opacity:.32} .bars .b small{font-family:var(--mono);font-size:9.5px;color:var(--faint);white-space:nowrap}
  .tod{display:flex;gap:8px;margin-top:6px} .tod .t{flex:1;text-align:center;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 8px} .tod .t b{font-family:var(--serif);font-weight:600;font-size:20px;display:block} .tod .t small{font-size:10.5px;color:var(--muted)}
  .abn{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)} .abn:last-child{border:0} .abn .d{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:64px} .abn .t{flex:1} .abn .c{font-family:var(--mono);font-size:12px;color:var(--rust);font-weight:600}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)} .empty h3{font-family:var(--serif);font-weight:600;color:var(--ink);margin:0 0 6px;font-size:19px} .empty p{margin:0 auto 16px;max-width:330px;font-size:14px}
  .cat-empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--faint);font-size:13px;text-align:center;margin-top:12px}
  .people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px} .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-sm)} .pcard .who b{display:block;font-weight:600;font-size:15px} .pcard .who small{font-family:var(--mono);font-size:11px;color:var(--faint)} .pcard .x{margin-left:auto;background:transparent;border:0;color:var(--faint);font-size:15px;padding:4px} .pcard .x:hover{color:var(--rust)}
  .setrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line-2)} .setrow:last-child{border-bottom:0} .setrow .info{flex:1} .setrow .info b{font-size:14.5px;font-weight:600} .setrow .info small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .themetoggle{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px} .themetoggle button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px} .themetoggle button.on{background:var(--accent);color:var(--on-accent)}

  .overlay{position:fixed;inset:0;background:#0008;backdrop-filter:blur(4px);display:grid;place-items:end center;z-index:60;opacity:0;pointer-events:none;transition:.18s} .overlay.show{opacity:1;pointer-events:auto}

  /* ===== stances, markers, patterns ===== */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:3px;text-align:left}

  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .kpi.warn b{color:var(--gold)} .kpi.bad b{color:var(--rust)} .kpi.good b{color:var(--good)}
  .kpi .spark{display:flex;align-items:flex-end;gap:2px;height:18px;margin-top:6px}
  .kpi .spark i{flex:1;background:var(--accent);border-radius:1.5px;min-height:2px;opacity:.5} .kpi .spark i.hi{opacity:1}

  .stance-chip{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid;white-space:nowrap}

  .stance-chip.body{color:var(--muted);border-color:var(--line);background:var(--panel-2)}
  .stance-chip.limit{color:var(--rust);border-color:var(--rust);background:var(--rust-soft)}
  .stance-chip.episode{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
  .stance-chip.fast{color:var(--good);border-color:var(--good);background:var(--good-soft)}

  .strip{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
  .strip .sh{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}

  .mstrip{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:11px 0 13px;border-bottom:1px solid var(--line-2);animation:mfade .22s ease}

  /* ---- combined consistency calendar: one cell per day, shaded by how much of
     that day's daily routine you finished. Sequential, single hue, light to dark. ---- */
  .cal{margin-top:2px}

  /* ============================================================
     One type family, size and weight for hierarchy, sentence case.
     Purple accent; green and coral kept strictly for status.
     ============================================================ */
  /* Prussian Blue & Burnt Saffron, dark is the primary theme */
  :root{
    --bg:#05131E; --panel:#0A2130; --panel-2:#0F2B3B; --raise:#143143;
    --ink:#F1E9D8; --muted:#93A9B6; --faint:#55707F; --line:#163647; --line-2:#0F2635;
    --accent:#E4913A; --accent-soft:#e4913a1e; --accent-ink:#F0A85A; --on-accent:#08161F;
    --gold:#E4B052; --gold-soft:#e4b05216; --rust:#E07553; --rust-soft:#e0755318;
    --good:#5AA7A0; --good-soft:#5aa7a018;
    --shadow:0 24px 56px -28px rgba(0,0,0,.82); --shadow-sm:0 1px 0 rgba(0,0,0,.3);
    --ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    --serif:"Fraunces", Georgia, serif; --sans:var(--ui); --mono:var(--ui);
  }
  :root[data-theme="warm"]{
    --bg:#EFE7D6; --panel:#F8F2E6; --panel-2:#F0E7D5; --raise:#FCF8F0;
    --ink:#152833; --muted:#546A75; --faint:#93A2AA; --line:#E0D6C1; --line-2:#EAE1D0;
    --accent:#C06A1E; --accent-soft:#c06a1e14; --accent-ink:#A85A15; --on-accent:#FFFFFF;
    --gold:#B07E1B; --gold-soft:#b07e1b14; --rust:#C25A3C; --rust-soft:#c25a3c12;
    --good:#3C7F78; --good-soft:#3c7f7812;
    --shadow:0 18px 44px -24px rgba(20,40,55,.22); --shadow-sm:0 1px 0 rgba(20,40,55,.05);
  }

  body{font-size:15.5px;letter-spacing:-.006em;font-feature-settings:"cv05","ss01"}
  h1.title{font-weight:700;letter-spacing:-.035em;line-height:1.04}
  h2,h3,h4,.modal-h h3,.empty h3,.strip .sh h3,.tile h3{font-weight:600;letter-spacing:-.018em}
  .brand b,.topbar b{font-weight:700;letter-spacing:-.03em}
  .kpi b,.statbox b,.schip b,.day-h .prog b,.tod .t b,.pcard .pct,.lrow .cnt b,.bignum input,.mval b,.nrow .n,.find .say,.time,.days,.calmons span,.caldays span,.heatlbl,.streak,.kpi .sub,.rule .cond{font-variant-numeric:tabular-nums}
  .kpi b,.statbox b,.schip b,.day-h .prog b,.tod .t b,.pcard .pct{font-weight:660;letter-spacing:-.03em}

  /* the all-caps mono label was the loudest generic tell, sentence case everywhere */
  .kicker,.nav-label,.sub-label,.field>label,.kpi small,.statbox small,.schip small,.tod .t small,
  .callegend,.heatlbl,.stance-chip,.lvl,.flagpill,.rtabs button,.bottomnav button,.strip .sh .note,
  .mini-btn,.chip,.tag,.pill,.streak,.days,.tagpick,.mchip,.time,.pcard .who small,.tagline .n,
  .mstrip .ask,.logbtn,.todo-add,.calmons span,.caldays span,.field .hint,.freqbar small,.mbars .mb small,
  .bars .b small,.abn .d,.abn .c,.find .tr,.find .top .who,.rule .k,.eyebrow{
    text-transform:none;letter-spacing:0;font-family:var(--ui)
  }
  .brand span,.me-btn .who small,.day-h .prog small,.dot7 small,.tile .pct,.sec-h .meta,.report .rh span,
  .heat + .heatlbl,.statbox b small,.abn .t,.setrow .info small,.pcard .who small{text-transform:none;letter-spacing:0;font-family:var(--ui)}
  .day-h .prog small{font-size:12.5px;font-weight:500;color:var(--muted)}
  .brand span{font-size:12px} .me-btn .who small{font-size:12px} .dot7 small{font-size:11px}
  .kicker{font-size:12.8px;color:var(--muted);letter-spacing:-.002em}
  .field>label{font-size:12px;font-weight:500;color:var(--muted)}
  .sub-label{font-size:12px;font-weight:500;color:var(--faint)}
  .nav-label{font-size:11.5px;font-weight:500;color:var(--faint)}
  .kpi small,.statbox small,.schip small,.tod .t small{font-size:12px;font-weight:500;color:var(--muted)}
  .stance-chip,.lvl{text-transform:capitalize;font-size:11px;font-weight:500}
  .flagpill{font-size:11px;font-weight:500}
  .pill,.tag,.chip,.tagpick,.mchip,.streak,.days,.time{font-size:12px;font-weight:500}
  .rtabs button{font-size:12.5px;font-weight:500}
  .bottomnav button{font-size:10.5px;font-weight:500}
  .callegend,.heatlbl{font-size:11.5px}
  .calmons span,.caldays span{font-size:10.5px;font-weight:500}
  .mstrip .ask{font-size:12.5px}
  .logbtn{font-size:12.5px;font-weight:500}

  /* sequential ramp follows the accent hue */
  .calcell.s1{background:var(--accent);opacity:.22}
  .calcell.s2{background:var(--accent);opacity:.45}
  .calcell.s3{background:var(--accent);opacity:.7}
  .calcell.s4{background:var(--accent);opacity:1}
  .callegend .sw.s1{background:var(--accent);opacity:.22} .callegend .sw.s2{background:var(--accent);opacity:.45}
  .callegend .sw.s3{background:var(--accent);opacity:.7} .callegend .sw.s4{background:var(--accent);opacity:1}
  .calcell.today{border-color:var(--ink)}
  .pcon i.s1{background:var(--accent);opacity:.3} .pcon i.s2{background:var(--accent);opacity:.55}
  .pcon i.s3{background:var(--accent);opacity:.78} .pcon i.s4{background:var(--accent);opacity:1}

  /* who-can-see picker */
  .seewrap{display:flex;flex-direction:column;gap:8px;margin:4px 0 2px}
  .seeopt{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);text-align:left;width:100%}
  .seeopt .rad{width:17px;height:17px;border-radius:50%;border:1.7px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center}
  .seeopt.on{border-color:var(--accent);background:var(--accent-soft)}
  .seeopt.on .rad{border-color:var(--accent)}
  .seeopt.on .rad::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .seeopt b{display:block;font-size:14px;font-weight:600}
  .seeopt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}

  .probe{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:18px 20px;margin-bottom:14px}
  .probe .ph{font-size:12.5px;color:var(--accent-ink);font-weight:500;margin:0 0 6px}
  .probe .pq{font-size:15.5px;line-height:1.5;margin:0 0 4px} .probe .pq b{font-weight:600}
  .probe .psub{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.5}
  .probe .prow{display:flex;flex-wrap:wrap;gap:7px}
  .probe .pskip{background:transparent;border:0;color:var(--faint);font-size:12.5px;padding:10px 0 0}
  .probe .pskip:hover{color:var(--muted)}
  .nowrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
  .nowrow:last-of-type{border-bottom:0}
  .nowrow .nm{flex:1;min-width:0;font-size:14.5px;font-weight:500}
  .nowrow .at{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .nowrow .at.over{color:var(--gold)}
  /* ---- activity rings ---- */
  .rings{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0 4px}
  .ringlegend{display:flex;flex-direction:column;gap:9px;width:100%;max-width:300px}
  .lgrow{display:flex;align-items:center;gap:11px}
  .lgrow .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .lgrow .lb{flex:1;min-width:0;font-size:14px;font-weight:500}
  .lgrow .vl{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .lgrow.off .lb,.lgrow.off .vl{color:var(--faint);font-weight:500}

  /* ---- today timeline ---- */
  .tline{display:flex;flex-direction:column;gap:0;margin-top:2px}
  .trow{display:grid;grid-template-columns:46px 20px 1fr auto;align-items:center;gap:10px;padding:9px 0}
  .trow .tt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
  .trow .tk{display:flex;align-items:center;justify-content:center;position:relative;align-self:stretch}
  .trow .tk::before{content:"";position:absolute;top:-9px;bottom:-9px;width:1.5px;background:var(--line)}
  .trow:first-child .tk::before{top:50%}
  .trow:last-child .tk::before{bottom:50%}
  .trow .tk i{width:11px;height:11px;border-radius:50%;border:2px solid var(--faint);background:var(--panel);position:relative;z-index:1;display:block}
  .trow.done .tk i{background:var(--accent);border-color:var(--accent)}
  .trow.late .tk i{border-color:var(--gold);background:var(--gold)}
  .trow .tn{font-size:14.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow.done .tn{color:var(--muted)}
  .trow .ts{font-size:11.5px;color:var(--faint);white-space:nowrap}
  .trow .ts.late{color:var(--gold)}
  .nowline{display:grid;grid-template-columns:46px 20px 1fr;align-items:center;gap:10px;padding:2px 0}
  .nowline .nt{font-size:12px;color:var(--accent-ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .nowline .nk{display:flex;justify-content:center}
  .nowline .nk i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .nowline .nr{height:1.5px;background:linear-gradient(90deg,var(--accent),transparent)}

  .carebox{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:13px 15px;margin-top:14px;width:100%}
  .carebox b{display:block;font-size:13px;color:var(--gold);font-weight:600;margin-bottom:5px}
  .carebox p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
  .evtag{font-size:10px;font-weight:500;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--faint);margin-left:7px;white-space:nowrap}
  .evtag.est{color:var(--good);border-color:var(--good)}
  .evtag.emg{color:var(--gold);border-color:var(--gold)}
  .phaselist{display:flex;flex-direction:column;gap:0}
  .plrow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .plrow:last-child{border-bottom:0}
  .plrow .ph{font-size:11.5px;color:var(--faint);width:58px;flex:none;font-variant-numeric:tabular-nums;padding-top:2px}
  .plrow .pd{flex:1;min-width:0}
  .plrow .pd b{display:block;font-size:14px;font-weight:600}
  .plrow .pd small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .plrow.on{background:var(--accent-soft);border-radius:10px;padding-left:11px;padding-right:11px;border-bottom-color:transparent}
  .protogroup{font-size:12px;color:var(--faint);font-weight:500;margin:16px 0 8px}
  .protogroup:first-of-type{margin-top:4px}

  /* ---- hero ring ---- */
  .hero{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 18px}
  .ringwrap{position:relative;display:grid;place-items:center}
  .ringwrap svg{display:block;transform:rotate(0deg)}
  .ringwrap .rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
  .ringwrap .rin b{font-size:36px;font-weight:660;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
  .ringwrap .rin small{font-size:12px;color:var(--muted);font-weight:500}
  .ringwrap.sm .rin b{font-size:23px} .ringwrap.sm .rin small{font-size:11px}
  .herolbl{font-size:13px;color:var(--muted);margin-top:12px}
  .herolbl b{color:var(--ink);font-weight:600}

  .daybars{display:flex;gap:9px;align-items:flex-end;margin-top:18px;height:54px}
  .daybar{display:flex;flex-direction:column;align-items:center;gap:7px;justify-content:flex-end;width:17px}
  .daybar i{width:100%;border-radius:5px 5px 3px 3px;background:var(--accent);display:block;min-height:3px}
  .daybar i.faint{opacity:.3} .daybar i.mid{opacity:.62}
  .daybar small{font-size:10.5px;color:var(--faint)}
  .daybar.now small{color:var(--accent-ink);font-weight:600}

  .statrow2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .statcell{background:var(--panel);padding:14px 12px;text-align:center}
  .statcell b{display:block;font-size:21px;font-weight:660;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .statcell small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
  .statcell.warn b{color:var(--gold)} .statcell.good b{color:var(--good)}

  /* ---- fasting ---- */
  .fastcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px 16px;margin-bottom:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .fastcard .fk{font-size:12px;color:var(--muted);letter-spacing:.01em;margin-bottom:10px}
  .fastcard .fk b{color:var(--accent-ink);font-weight:600}
  .phasebar{display:flex;gap:3px;width:100%;margin-top:18px;position:relative}
  .phaseseg{flex:1;border-radius:5px;background:var(--panel-2);padding:8px 6px 7px;text-align:center;position:relative;overflow:hidden}
  .phaseseg small{font-size:10px;color:var(--faint);position:relative;z-index:1;display:block}
  .phaseseg.done{background:var(--accent-soft)} .phaseseg.done small{color:var(--muted)}
  .phaseseg.on{background:var(--accent)} .phaseseg.on small{color:var(--on-accent);font-weight:600}
  .fastbtns{display:flex;gap:9px;width:100%;margin-top:16px}
  .fastbtns .btn{flex:1;justify-content:center}
  .fastnote{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:12px;text-align:center;max-width:36ch}
  .proto{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);width:100%;text-align:left;margin-bottom:8px}
  .proto.on{border-color:var(--accent);background:var(--accent-soft)}
  .proto .pn{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;width:56px;flex:none}
  .proto .pb{flex:1;min-width:0} .proto .pb b{display:block;font-size:14px;font-weight:600}
  .proto .pb small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .fastrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .fastrow:last-child{border-bottom:0}
  .fastrow .fd{font-size:14px;font-weight:600;width:62px;flex:none;font-variant-numeric:tabular-nums}
  .fastrow .fi{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
  .fastrow .fbar{width:70px;height:5px;border-radius:20px;background:var(--panel-2);overflow:hidden;flex:none}
  .fastrow .fbar>i{display:block;height:100%;background:var(--accent)}

  .flagline{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .flagline:last-child{border-bottom:0}
  .flagline b{flex:1;font-size:14px;font-weight:500}
  .flagline .x{background:transparent;border:0;color:var(--faint);font-size:14px} .flagline .x:hover{color:var(--rust)}
  /* ===== Orbit tile (solar-system days-behind), Stage 1 ===== */
  .orbit-card{padding:0;overflow:hidden;background:#030B13;border-color:#0A2130}
  .orbit-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 0}
  .orbit-card #ecoStage{color:#F1EFFA;font-size:14px;font-weight:700;font-family:var(--serif)}
  .orbit-card .eco-today{color:#B9B3D6;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
  .orbit-msg{margin:3px 16px 0;color:#9C96BE;font-size:12.5px;line-height:1.5}
  .orbit-note{color:#7C769B;font-size:11.5px;padding:2px 16px 14px}
  .orbit-card #forest{margin-top:6px}

  /* ===== Progress card (rings + med/routine bars) ===== */
  .prog-card{padding:16px}
  .pcard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .pcard-title{font-family:var(--serif);font-size:16px;font-weight:600}
  .pcard-top{display:flex;gap:16px;align-items:center}
  .rings-wrap{width:150px;height:150px;flex:none}
  .rings-wrap svg{width:150px;height:150px;display:block}
  .rings-wrap .ring-bg{fill:none;stroke:var(--panel-2);opacity:.9}
  .rings-side{flex:1;min-width:0}
  .today-row{display:flex;align-items:baseline;justify-content:space-between}
  .today-lab{font-size:12px;font-weight:600;color:var(--muted)}
  .today-pct{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .obar{height:7px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin:4px 0 13px}
  .obar-fill{height:100%;background:linear-gradient(90deg,var(--good),var(--accent));border-radius:99px}
  .rlegend{display:flex;flex-direction:column;gap:8px}
  .rl{display:flex;align-items:center;gap:10px}
  @media(max-width:460px){
    .pcard-top{flex-direction:column;align-items:stretch;gap:14px}
    .rings-wrap{margin:0 auto}
    .rings-side{width:100%}
  }
  .rl-dot{width:10px;height:10px;border-radius:50%;flex:none}
  .rl-lb{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap}
  .rl-vl{flex:none;margin-left:auto;font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .bars-block{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .bars-h{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-bottom:11px}
  .mbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .mbar:last-child{margin-bottom:0}
  .mbar-ic{width:9px;height:9px;border-radius:3px;flex:none}
  .mbar-lb{font-size:13px;font-weight:500;width:82px;flex:none}
  .mbar-dots{flex:1;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .mbar-dots i{width:10px;height:10px;border-radius:50%;background:var(--panel-2);flex:none}
  .mbar-empty{font-size:11.5px;color:var(--faint)}
  .mbar-n{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;width:38px;text-align:right;flex:none}
  .edit-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer}
  .edit-btn:hover{color:var(--ink)}
  .ring-editor{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:11px}
  .re-row{display:flex;align-items:center;gap:10px}
  .re-name{width:52px;flex:none;font-size:13px;font-weight:600}
  .re-sw{flex:1;display:flex;gap:6px;flex-wrap:wrap}
  .re-c{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .re-c.on{border-color:var(--ink)}
  .re-mv{display:flex;gap:4px;flex:none}
  .re-mv button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
  .re-mv button:disabled{opacity:.3;cursor:default}

  /* ===== Today's note (quote) ===== */
  .quote{position:relative;padding:20px 18px;background:linear-gradient(135deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .quote .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .quote blockquote{margin:10px 0 0;font-family:var(--serif);font-size:20px;line-height:1.42;font-weight:500;letter-spacing:-.005em;max-width:32ch;color:var(--ink)}
  .quote cite{display:block;margin-top:10px;font-style:normal;font-size:12px;color:var(--muted)}
  .quote .mark{position:absolute;top:6px;right:16px;font-family:var(--serif);font-size:76px;line-height:1;color:var(--accent);opacity:.16}

  /* ===== This week bars, visible tracks, clear empty space ===== */
  .weekbars2{display:flex;gap:9px;align-items:flex-end;height:92px;padding:8px 2px 2px}
  .weekbars2 .wbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
  .weekbars2 .wtrack{width:100%;max-width:28px;flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
  .weekbars2 .wtrack i{display:block;width:100%;background:linear-gradient(var(--gold),var(--good));border-radius:7px;min-height:3px}
  .weekbars2 .wbar small{font-size:11.5px;color:var(--muted);font-weight:500}
  .weekbars2 .wbar.today .wtrack{border-color:var(--accent)}
  .weekbars2 .wbar.today small{color:var(--accent);font-weight:700}

  /* ===== Day scroller (alarm-wheel picker) ===== */
  .dayscroll-wrap{margin:0 -18px 16px}
  .dayscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 42% 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .dayscroll::-webkit-scrollbar{display:none}
  .dchip{scroll-snap-align:center;flex:none;width:54px;height:66px;border-radius:17px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;box-shadow:var(--shadow-sm)}
  .dchip small{font-size:10.5px;color:var(--muted);font-weight:600}
  .dchip b{font-family:var(--serif);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .dchip.sel{background:var(--accent);border-color:var(--accent)}
  .dchip.sel small,.dchip.sel b{color:var(--on-accent)}

  /* ===== Consistency: show-dates toggle ===== */
  .cpanel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .cpanel-h h4{margin:0}
  .mini-toggle{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;cursor:pointer}
  .mini-toggle.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .calcell{position:relative}
  .calcell em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7px;font-style:normal;font-weight:700;color:var(--ink);opacity:.72;line-height:1}
  .calcell.fut em,.calcell.today em{opacity:.9}

  /* ===== Fasting (home entry + page) ===== */
  .fasthome{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;margin-bottom:14px;cursor:pointer}
  .fasthome .fh-ring{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
  .fasthome .fh-ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
  .fasthome .fh-ring i{position:relative;z-index:1;font-style:normal;font-size:12px;font-weight:700;color:var(--ink)}
  .fasthome .fh-mid{flex:1;min-width:0}
  .fasthome .fh-mid b{display:block;font-size:15px;font-weight:600;font-family:var(--serif)}
  .fasthome .fh-mid small{color:var(--muted);font-size:12.5px}

     Nothing here is a health claim, and autophagy timing is deliberately not charted -
     the human evidence for when it peaks is not settled. */
  var FPHASES=[
    [0,4,"Fed","Food is still being absorbed; insulin is high.","est"],
    [4,12,"Early","Running mostly on glycogen stored in the liver.","est"],
    [12,16,"Fat-burn","Glycogen thins out and more energy comes from fat.","est"],
    [16,24,"Ketosis","Ketones rise and take a bigger share of the fuel.","est"],
    [24,48,"Deep","Ketones high. Water and electrolytes start to matter.","emg"],
    [48,999,"Prolonged","Past two days. This is medical-supervision territory.","emg"]
  ];
  function phasesFor(target){
    var lim=Math.max(target||16,12),out=[];
    for(var q=0;q<FPHASES.length;q++){out.push(FPHASES[q]);if(FPHASES[q][0]>=lim)break;}
    return out;
  }
  function activeFast(i){return (i.fasts||[]).filter(function(f){return !f.e})[0]||null}
  function doneFasts(i){return (i.fasts||[]).filter(function(f){return f.e}).sort(function(a,b){return b.s-a.s})}
  function fastHours(f){return ((f.e||Date.now())-f.s)/3600000}
  function fmtHM(h){var m=Math.max(0,Math.round(h*60));return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"}
  function targetOf(i){var a=activeFast(i);return (a&&a.target)||(i.protocol&&i.protocol.fast)||16}
  function startFast(i,target){
    if(activeFast(i))return;
    var fs=(i.fasts||[]).slice();fs.push({s:Date.now(),e:null,target:target||(i.protocol&&i.protocol.fast)||16});
    Store.update("items",i.id,{fasts:fs});
  }
  function endFast(i){
    var fs=(i.fasts||[]).map(function(f){return Object.assign({},f)});
    var a=fs.filter(function(f){return !f.e})[0];if(!a)return 0;
    a.e=Date.now();Store.update("items",i.id,{fasts:fs});return fastHours(a);
  }
  function fastAvg(i,n){var d=doneFasts(i).slice(0,n||14);if(!d.length)return null;
    var t=0;d.forEach(function(f){t+=fastHours(f)});return Math.round(t/d.length*10)/10}
  function fastBest(i){var b=0;doneFasts(i).forEach(function(f){var h=fastHours(f);if(h>b)b=h});return b}
  function fastOnDay(i,ds){var out=0;(i.fasts||[]).forEach(function(f){
    var d=new Date(f.s);var k=fmt(d);if(k===ds){var h=fastHours(f);if(h>out)out=h;}});return out}
  function anyActiveFast(){return Store.all("items").some(function(i){return isFast(i)&&activeFast(i)})}
  function phaseAt(h){for(var q=0;q<FPHASES.length;q++)if(h>=FPHASES[q][0]&&h<FPHASES[q][1])return q;return FPHASES.length-1}
  function phaseBar(target,elapsed){
    var ps=phasesFor(target),cur=(elapsed==null?-1:phaseAt(elapsed));
    var cap=Math.max(target,ps[ps.length-1][0]+4);
    return '<div class="phasebar">'+ps.map(function(pz,ix){
      var w=Math.min(pz[1],cap)-pz[0];
      return '<div class="phaseseg '+(ix===cur?"on":(ix<cur?"done":""))+'" style="flex:'+Math.max(1,w)+'"><small>'+pz[2]+'</small></div>';
    }).join("")+'</div>';
  }
  function protoLabel(h){return h>=24?(h+"h"):(h+":"+(24-h))}
  function isExtended(i){return targetOf(i)>=24}
  function extAcked(){try{return localStorage.getItem("ritsu_ext_ack")==="1"}catch(e){return false}}
  function ackExt(){try{localStorage.setItem("ritsu_ext_ack","1")}catch(e){}}
  function careBox(){
    return '<div class="carebox"><b>While you are past a day</b><p>Keep drinking, and add a pinch of salt to one glass, most trouble on a long fast is water and electrolytes, not hunger. '+
      '<b style="display:inline;color:var(--ink)">Stop and eat</b> if you feel faint, dizzy, confused, or your heart is racing. If that does not settle quickly, get medical help.</p></div>';
  }

  /* ---- three concentric rings: one per stance. The whole model in one glyph. ---- */
  function activityRings(size){
    var tp=todayProg();
    var bod=visibleItems().filter(isBody),lim=visibleItems().filter(isLimit);
    var bOk=bod.filter(function(i){return countOn(i,today())>0&&inRangeOn(i,today())&&!flagsOn(i,today()).length}).length;
    var lOk=lim.filter(function(i){return countOn(i,today())===0}).length;
    var rows=[
      {pct:tp.total?tp.done/tp.total:null,col:"var(--accent)",lb:"Routine",vl:tp.total?tp.done+" of "+tp.total:"nothing set",on:tp.total>0},
      {pct:bod.length?bOk/bod.length:null,col:"var(--good)",lb:"Body",vl:bod.length?bOk+" of "+bod.length+" in range":"nothing set",on:bod.length>0},
      {pct:lim.length?lOk/lim.length:null,col:"var(--rust)",lb:"Holding off",vl:lim.length?(lOk===lim.length?"all clear today":(lim.length-lOk)+" logged today"):"nothing set",on:lim.length>0}
    ];
    var stroke=Math.round(size*0.093),gap=Math.round(stroke*0.5);
    var svg='<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" aria-hidden="true">';
    rows.forEach(function(r,ix){
      var rad=(size-stroke)/2-ix*(stroke+gap);var c=2*Math.PI*rad;
      svg+='<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+rad+'" fill="none" stroke="'+r.col+'" stroke-opacity="0.15" stroke-width="'+stroke+'"></circle>';
      if(r.pct!=null)svg+='<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+rad+'" fill="none" stroke="'+r.col+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-Math.min(1,r.pct))).toFixed(1)+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"></circle>';
    });
    svg+='</svg>';
    var leg='<div class="ringlegend">'+rows.map(function(r){
      return '<div class="lgrow '+(r.on?"":"off")+'"><span class="dot" style="background:'+r.col+';opacity:'+(r.on?1:.35)+'"></span><span class="lb">'+r.lb+'</span><span class="vl">'+esc(r.vl)+'</span></div>';
    }).join("")+'</div>';
    return '<div class="rings">'+svg+leg+'</div>';
  }

  /* ---- today on a time axis, from the expected times ---- */
  function todayTimeline(){
    var now=minsOf(nowHM());
    function whenOf(i){return expectOf(i)||(i.reminder?{at:i.reminder,slack:90,dir:"either"}:null)}
    var its=visibleItems().filter(function(i){return !isEpisode(i)&&!isFast(i)&&whenOf(i)});
    if(its.length<2)return "";
    its.sort(function(a,b){return minsOf(whenOf(a).at)-minsOf(whenOf(b).at)});
    var placed=false,h='<div class="panel"><h4>Today, in order</h4><div class="tline">';
    its.forEach(function(i){
      var at=minsOf(whenOf(i).at);
      if(!placed&&at>now){h+='<div class="nowline"><span class="nt">'+esc(fmtTime(nowHM()))+'</span><span class="nk"><i></i></span><span class="nr"></span></div>';placed=true;}
      var logged=(i.kind==="measure")?((i.values||{})[today()]!=null):countOn(i,today())>0;
      var dr=logged?driftOn(i,today()):null;
      var late=(!logged&&at<now-(whenOf(i).slack==null?60:whenOf(i).slack));
      var t=logged?(completionTime(i,today())||((evOn(i,today()).slice(-1)[0]||{}).t)):null;
      h+='<div class="trow '+(logged?"done":(late?"late":""))+'"><span class="tt">'+esc(fmtTime(whenOf(i).at))+'</span>'+
        '<span class="tk"><i></i></span>'+
        '<span class="tn" data-open="'+i.id+'">'+esc(i.title)+'</span>'+
        '<span class="ts '+(dr?"late":"")+'">'+(logged?(t?esc(fmtTime(t)):"done")+(dr?" \u00b7 "+fmtMins(dr.mins)+(dr.mins>0?" late":" early"):""):(late?"not yet":""))+'</span></div>';
    });
    if(!placed)h+='<div class="nowline"><span class="nt">'+esc(fmtTime(nowHM()))+'</span><span class="nk"><i></i></span><span class="nr"></span></div>';
    return h+'</div></div>';
  }

  /* ---- one SVG ring, used for the day and for a running fast ---- */
  function ringSVG(pct,size,stroke,big,sub,cls){
    var r=(size-stroke)/2,c=2*Math.PI*r;
    var off=c*(1-Math.max(0,Math.min(1,pct||0)));
    return '<div class="ringwrap '+(cls||"")+'" style="width:'+size+'px;height:'+size+'px">'+
      '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" aria-hidden="true">'+
      '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--panel-2)" stroke-width="'+stroke+'"></circle>'+
      '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"></circle>'+
      '</svg><div class="rin"><b>'+big+'</b><small>'+sub+'</small></div></div>';
  }
  /* ---- the fourth anomaly: when something happens, not whether ---- */
  function minsOf(t){var q=(""+t).split(":");return (+q[0])*60+(+(q[1]||0))}
  function fmtMins(m){m=Math.abs(Math.round(m));var hh=Math.floor(m/60),mm=m%60;
    return hh?(hh+"h"+(mm?" "+mm+"m":"")):(mm+" min"+(mm===1?"":"s"))}
  function expectOf(i){return (i.expect&&i.expect.at)?i.expect:null}
  function wrapDiff(d){if(d<-720)d+=1440;if(d>720)d-=1440;return d}
  function driftOn(i,ds){
    var ex=expectOf(i);if(!ex)return null;
    var evs=evOn(i,ds).filter(function(e){return e.t});if(!evs.length)return null;
    var t=evs[evs.length-1].t;
    var d=wrapDiff(minsOf(t)-minsOf(ex.at));
    var slack=(ex.slack==null?60:ex.slack);
    var dir=ex.dir||"either";
    if(dir==="late"&&d<=slack)return null;
    if(dir==="early"&&d>=-slack)return null;
    if(dir==="either"&&Math.abs(d)<=slack)return null;
    return {mins:d,t:t};
  }
  function epsOf(i){return (i.episodes||[]).slice().sort(function(a,b){return (a.start<b.start)?1:-1})}
  function activeEp(i){return (i.episodes||[]).filter(function(e){return !e.end})[0]||null}
  function epDays(e){var end=e.end||today();return Math.abs(dCount(end)-dCount(e.start))+1}
  function epAvg(i){var done=epsOf(i).filter(function(e){return e.end});if(!done.length)return null;
    var t=0;done.forEach(function(e){t+=epDays(e)});return Math.round(t/done.length*10)/10}
  function epRange(e){var a=new Date(e.start+"T00:00:00");var b=new Date((e.end||today())+"T00:00:00");
    return MON[a.getMonth()]+" "+a.getDate()+(e.end?", "+MON[b.getMonth()]+" "+b.getDate():"")}
  function startEpisode(i){var eps=(i.episodes||[]).slice();if(activeEp(i))return;
    eps.push({start:today(),end:null,flags:{},note:""});Store.update("items",i.id,{episodes:eps});}
  function endEpisode(i){var eps=(i.episodes||[]).map(function(e){return Object.assign({},e)});
    var a=eps.filter(function(e){return !e.end})[0];if(!a)return;a.end=today();Store.update("items",i.id,{episodes:eps});}
  function epFlagsOn(i,ds){var a=activeEp(i)||epsOf(i)[0];if(!a)return[];return (a.flags||{})[ds]||[]}
  function toggleEpFlag(i,f){var eps=(i.episodes||[]).map(function(e){return Object.assign({},e,{flags:Object.assign({},e.flags||{})})});
    var a=eps.filter(function(e){return !e.end})[0];if(!a)return;
    var cur=(a.flags[today()]||[]).slice();var ix=cur.indexOf(f);if(ix>-1)cur.splice(ix,1);else cur.push(f);
    if(cur.length)a.flags[today()]=cur;else delete a.flags[today()];
    Store.update("items",i.id,{episodes:eps});}

  /* partial credit: 50 pages of a 100-page goal is half a tick, not zero */
  function creditOn(i,ds){
    if(i.kind==="measure"){var v=(i.values||{})[ds];if(v==null)return 0;var t=i.target||0;if(t<=0)return v!=null?1:0;return Math.max(0,Math.min(1,v/t));}
    if(i.kind==="todo"&&isRepeat(i)){var pd=Math.max(1,normOf(i).max||perDayOf(i));return Math.max(0,Math.min(1,countOn(i,ds)/pd));}
    return metOn(i,ds)?1:0;
  }
  function isRoutine(i){return stanceOf(i)==="routine"}
  function isBody(i){return stanceOf(i)==="body"}
  function isLimit(i){return stanceOf(i)==="limit"}
  function logged(i){return i.kind==="todo"||i.kind==="med"}
  /* items that carry a day-by-day pattern worth scanning */
  function scannable(i){return !isEpisode(i)&&!isFast(i)&&logged(i)&&(isRepeat(i)||i.kind==="med"||isBody(i)||isLimit(i))}

  function normOf(i){var n=i.normal||{};return {min:n.min,max:n.max,gap:n.maxGapDays,week:n.maxPerWeek}}
  function inRangeOn(i,ds){
    var N=normOf(i),c=countOn(i,ds);
    if(N.min!=null&&c<N.min)return false;
    if(N.max!=null&&c>N.max)return false;
    return true;
  }
  function inRangeRatio(i,days){var ok=0;for(var k=0;k<days;k++){if(inRangeOn(i,addDaysStr(today(),-k))&&!flagsOn(i,addDaysStr(today(),-k)).length)ok++;}return {ok:ok,of:days}}
  /* days since the previous occurrence at or before ds */
  function gapAt(i,ds){for(var k=1;k<=90;k++){if(countOn(i,addDaysStr(ds,-k))>0)return k;}return null}
  function cleanStreak(i){var d=today(),c=0;while(c<3660&&countOn(i,d)===0){c++;d=addDaysStr(d,-1);}return c}
  function bestCleanStreak(i){
    var ds=Object.keys(i.events||{}).filter(function(d){return dCount(d)<=0}).sort();
    if(!ds.length){var since=dCount(i.createdDate||today());return Math.max(cleanStreak(i),Math.abs(since));}
    var best=0,prev=null;
    ds.forEach(function(d){if(prev){var g=dCount(d)-dCount(prev)-1;if(g>best)best=g;}prev=d;});
    var tail=cleanStreak(i);if(tail>best)best=tail;
    return best;
  }
  function lastSlip(i){var ds=Object.keys(i.events||{}).filter(function(d){return dCount(d)<=0}).sort();return ds.length?ds[ds.length-1]:null}
  function weekCount(i,ds){var n=0;for(var k=0;k<7;k++)n+=countOn(i,addDaysStr(ds||today(),-k));return n}

  /* ---- the five anomaly rules ---- */
  function anomaliesOn(i,ds){
    var out=[];if(!scannable(i)||dCount(ds)>0)return out;
    var N=normOf(i),c=countOn(i,ds);
    flagsOn(i,ds).forEach(function(f){var m=mkInfo(f);if(!m||m.t)return;out.push({k:"m:"+f,type:"marker",marker:f,sev:m.s});});
    var dr=driftOn(i,ds);if(dr)out.push({k:"time",type:"time",sev:"note",n:Math.abs(dr.mins),late:dr.mins>0});
    if(isLimit(i)){
      if(N.max!=null&&c>N.max)out.push({k:"slip",type:"slip",sev:"note",n:c});
      else if(N.week!=null&&weekCount(i,ds)>N.week)out.push({k:"week",type:"week",sev:"note",n:weekCount(i,ds)});
    } else {
      if(N.max!=null&&c>N.max)out.push({k:"high",type:"high",sev:"watch",n:c});
      if(N.min!=null&&c>0&&c<N.min)out.push({k:"low",type:"low",sev:"note",n:c});
      /* a gap only means something for body items, for routine work, a missed day is just a missed day,
         and the streak already says so */
      if(isBody(i)&&N.gap!=null&&c===0){var g=gapAt(i,ds);if(g!=null&&g>N.gap)out.push({k:"gap",type:"gap",sev:g>N.gap+1?"watch":"note",n:g});}
    }
    return out;
  }
  function anyAnomalyOn(i,ds){return anomaliesOn(i,ds).length>0}

  /* ---- escalation: a single odd day is noise. Persistence decides prominence. ---- */
  function maxConsec(dates){
    var s=dates.slice().sort(),best=0,cur=0,prev=null;
    s.forEach(function(d){if(prev&&dCount(d)-dCount(prev)===1)cur++;else cur=1;if(cur>best)best=cur;prev=d;});
    return best;
  }
  function levelFor(rec){
    var n=rec.n,sev=rec.sev,consec=maxConsec(rec.dates);
    /* a limit item that's trending down is good news, not an escalation */
    if(rec.type==="slip"||rec.type==="week"){
      if(rec.prev>0&&n<rec.prev)return "noted";
      if(n>=3&&n>rec.prev)return "persistent";
      return n>=2?"recurring":"noted";
    }
    /* a gap escalates by how LONG it ran, not how many days got flagged */
    if(rec.type==="gap"){
      var over=rec.peak-(normOf(rec.item).gap||1);
      if(over>=3)return "persistent";
      if(over>=1)return "recurring";
      return "noted";
    }
    if(sev==="urgent"&&n>=2)return "persistent";
    if(n>=3)return "persistent";
    if(rec.prev>0&&n>=2)return "persistent";
    if(n>=2||consec>=2)return "recurring";
    if(n>=1)return "noted";
    return null;
  }
  function patternScan(days){
    var out=[];
    visibleItems().forEach(function(i){
      if(!scannable(i))return;
      var keys={};
      for(var k=0;k<days;k++){
        var ds=addDaysStr(today(),-k);
        anomaliesOn(i,ds).forEach(function(a){
          if(!keys[a.k])keys[a.k]={item:i,k:a.k,type:a.type,marker:a.marker,sev:a.sev,dates:[],prev:0,peak:0};
          keys[a.k].dates.push(ds);
          if(a.n&&a.n>keys[a.k].peak)keys[a.k].peak=a.n;
        });
      }
      for(var q=days;q<days*2;q++){
        var ds2=addDaysStr(today(),-q);
        anomaliesOn(i,ds2).forEach(function(a){if(keys[a.k])keys[a.k].prev++;});
      }
      Object.keys(keys).forEach(function(kk){
        var r=keys[kk];r.n=r.dates.length;r.level=levelFor(r);
        if(r.level)out.push(r);
      });
    });
    out.sort(function(a,b){return (LV[b.level]-LV[a.level])||(SEVRANK[b.sev]-SEVRANK[a.sev])||(b.n-a.n)});
    return out;
  }
  function dayNames(dates,max){
    var s=dates.slice().sort();var names=s.map(function(d){return DOW[new Date(d+"T00:00:00").getDay()]});
    max=max||4;
    if(names.length>max)return names.slice(0,max).join(", ")+" +"+(names.length-max)+" more";
    return names.length===1?names[0]:names.slice(0,-1).join(", ")+" and "+names[names.length-1];
  }
  function dayShort(ds){var d=new Date(ds+"T00:00:00");return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]}
  function findingText(r){
    var i=r.item;
    if(r.type==="marker"){
      var nm=mkInfo(r.marker).n||r.marker;
      return "<b>"+esc(nm)+" noted on "+r.n+(r.n===1?" day":" of the last 7 days")+"</b>, "+dayNames(r.dates)+".";
    }
    if(r.type==="time"){
      var ex=expectOf(i),tot=0,late=0;
      r.dates.forEach(function(d){var q=driftOn(i,d);if(q){tot+=q.mins;if(q.mins>0)late++;}});
      var avg=tot/r.dates.length;
      return "<b>"+r.n+" of the last "+(r.n===1?"day":"7 days")+" ran "+fmtMins(avg)+" "+(avg>0?"late":"early")+"</b>, "+dayNames(r.dates)+". You aim for "+esc(fmtTime(ex.at))+".";
    }
    if(r.type==="gap"){
      var end=r.dates.slice().sort()[r.dates.length-1];
      var st0=addDaysStr(end,-(r.peak-1));
      return "<b>Nothing logged for "+r.peak+" days</b>, "+esc(dayShort(st0))+" to "+esc(dayShort(end))+". Your usual gap is "+(normOf(i).gap||1)+".";
    }
    if(r.type==="high")return "<b>Over the usual count on "+r.n+(r.n===1?" day":" days")+"</b>, peaked at "+r.peak+"×, usual is "+normOf(i).max+".";
    if(r.type==="low")return "<b>Under the usual count on "+r.n+(r.n===1?" day":" days")+"</b>, usual is "+normOf(i).min+"× a day.";
    if(r.type==="slip"){
      var tot=0;r.dates.forEach(function(d){tot+=countOn(i,d)});
      var fl={};r.dates.forEach(function(d){flagsOn(i,d).forEach(function(f){fl[f]=(fl[f]||0)+1})});
      var top=Object.keys(fl).sort(function(a,b){return fl[b]-fl[a]})[0];
      return "<b>"+tot+" this week</b>"+(top?", mostly tagged “"+esc(mkInfo(top).n||top)+"”":"")+", "+dayNames(r.dates)+".";
    }
    if(r.type==="week")return "<b>Over your weekly cap</b>, "+r.peak+" in seven days, cap is "+normOf(i).week+".";
    return "<b>Something to look at</b> on "+r.n+" days.";
  }
  function trendText(r){
    if(r.prev===0&&r.n>0)return r.level==="noted"?"first time in a fortnight":"<span class='up'>new this week</span>";
    if(r.n>r.prev)return "<span class='up'>↑ up from "+r.prev+" last week</span>";
    if(r.n<r.prev)return "<span class='dn'>↓ down from "+r.prev+" last week</span>";
    return "same as last week";
  }

  /* ---- headline numbers. Routine only: a skipped workout and a drink must not dent the same number. ---- */
  /* ---- who can see what. A to-do is yours unless you tag someone into it. ---- */
  function canSee(i){
    if(i.catId!==TODO_CAT)return true;
    if(!state.me||!i.owner)return true;
    return i.owner===state.me||(i.assignees||[]).indexOf(state.me)>-1;
  }
  function visibleItems(){return Store.all("items").filter(canSee)}
  var PROBE_REASONS=[["work","Work ran late"],["sleepless","Couldn\'t sleep"],["out","I was out"],["phone","On my phone"],
    ["stress","Stressed"],["unwell","Wasn\'t well"],["travel","Travelling"],["busy","Just busy"],["nothing","Nothing in particular"]];
  function probeLabel(k){for(var q=0;q<PROBE_REASONS.length;q++)if(PROBE_REASONS[q][0]===k)return PROBE_REASONS[q][1];return k}
  var PROBEABLE={time:1,slip:1,gap:1,low:1,week:1};
  /* ask once when a pattern sets in, then leave it alone, a prompt every day is a nag */
  function probeAsked(){try{return localStorage.getItem("ritsu_probe_day")===today()}catch(e){return false}}

  /* ---- one number per day: of the daily routine things that existed that day,

  /* an item counts from whichever is earlier: when it was created, or its first log */
  function startedOn(i){
    var ks=Object.keys(i.events||{});
    if(i.kind==="measure")ks=ks.concat(Object.keys(i.values||{}));
    if(!ks.length)return i.createdDate||null;
    ks.sort();var first=ks[0];
    if(!i.createdDate)return first;

  }

      if(!trackable(i))return false;

    });
  }
  function dayScore(ds){

  function calCells(weeks){
    weeks=weeks||18;
    var end=new Date(today()+"T00:00:00");
    var dowMon=(end.getDay()+6)%7;                 /* rows run Mon → Sun */
    var lastCol=new Date(end);lastCol.setDate(lastCol.getDate()-dowMon);
    var cols=[];
    for(var w=weeks-1;w>=0;w--){
      var cs=new Date(lastCol);cs.setDate(cs.getDate()-w*7);
      var days=[];for(var r=0;r<7;r++){var d=new Date(cs);d.setDate(d.getDate()+r);days.push(fmt(d));}
      cols.push(days);
    }
    return cols;
  }
  /* Month-block calendar: each month holds only its own days, so nothing bleeds
     across a boundary. A faint hairline + gap separates one month from the next. */
  function calendarPanel(months){
    months=months||6;
    var end=new Date(today()+"T00:00:00");
    var firstM=new Date(end.getFullYear(),end.getMonth()-(months-1),1);
    var blocks=[],cur=new Date(firstM);
    while(cur<=end){
      var y=cur.getFullYear(),m=cur.getMonth(),last=new Date(y,m+1,0).getDate();
      var cols=[],col=[null,null,null,null,null,null,null],used=false;
      for(var day=1;day<=last;day++){
        var d=new Date(y,m,day),row=(d.getDay()+6)%7;
        col[row]=fmt(d);used=true;
        if(row===6){cols.push(col);col=[null,null,null,null,null,null,null];used=false;}
      }
      if(used)cols.push(col);
      blocks.push({label:MON[m],year:y,jan:(m===0),cols:cols});
      cur=new Date(y,m+1,1);
    }
    var h='<div class="cal2"><div class="cal2-days"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div>';
    h+='<div class="cal2-scroll"><div class="cal2-row">';
    blocks.forEach(function(bl){
      h+='<div class="cmonth"><div class="cmlab">'+bl.label+(bl.jan?" ’"+String(bl.year).slice(2):"")+'</div><div class="cmgrid">';
      bl.cols.forEach(function(cc){
        h+='<div class="calcol">';
        cc.forEach(function(ds){
          if(!ds){h+='<div class="calcell pad"></div>';return;}
          var fut=dCount(ds)>0;var s=fut?null:dayScore(ds);var d=new Date(ds+"T00:00:00");
          var tip=DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+(s?", "+s.met+" of "+s.of:fut?"":", nothing logged");
          h+='<div class="calcell '+(fut?"fut":scoreClass(s))+(ds===today()?" today":"")+'" title="'+esc(tip)+'">'+(calDates?'<em>'+d.getDate()+'</em>':'')+'</div>';
        });
        h+='</div>';
      });
      h+='</div></div>';
    });
    h+='</div></div></div>';
    h+='<div class="callegend"><span>none</span><i class="sw"></i><i class="sw s1"></i><i class="sw s2"></i><i class="sw s3"></i><i class="sw s4"></i><span>all done</span></div>';
    return h;
  }

  function homeMetrics(){
    var t=today();
    var td=itemsOf(TODO_CAT).filter(function(i){return !isRepeat(i)});
    var open=td.filter(function(i){return !i.done&&i.dueDate&&dCount(i.dueDate)<=0});
    var doneT=td.filter(function(i){return i.done&&i.completedAt&&(""+i.completedAt).slice(0,10)===t});
    var bod=visibleItems().filter(isBody);
    var bOk=bod.filter(function(i){return countOn(i,t)>0&&inRangeOn(i,t)&&!flagsOn(i,t).length}).length;
    var meds=visibleItems().filter(function(i){return i.kind==="med"&&onToday(i)});
    var medDone=meds.filter(doneForNow).length;
    var rout=visibleItems().filter(function(i){return isRoutine(i)&&i.kind!=="med"&&onToday(i)});
    var routDone=rout.filter(doneForNow).length;
    var tp=todayProg();
    return {todoTot:open.length+doneT.length,todoDone:doneT.length,bodTot:bod.length,bodOk:bOk,
            medTot:meds.length,medDone:medDone,routTot:rout.length,routDone:routDone,
            mindTot:tp.total,mindDone:tp.done};
  }
  var RING_PAL=["#E4913A","#4E92B8","#3E8E8A","#E07553","#5FA0C4","#B07ED0","#E4B052","#5AA77E"];
  var ringCfg=null;
  function loadRings(){try{ringCfg=JSON.parse(localStorage.getItem("ritsu_rings"));}catch(e){}
    if(!ringCfg||!ringCfg.length)ringCfg=[{key:"todo",color:"#E4913A"},{key:"body",color:"#4E92B8"},{key:"mind",color:"#3E8E8A"}];}
  function saveRings(){try{localStorage.setItem("ritsu_rings",JSON.stringify(ringCfg));}catch(e){}}
  function moveRing(key,dir){if(!ringCfg)loadRings();var ix=-1;for(var i=0;i<ringCfg.length;i++)if(ringCfg[i].key===key)ix=i;
    var nix=ix+dir;if(ix<0||nix<0||nix>=ringCfg.length)return;var t=ringCfg[ix];ringCfg[ix]=ringCfg[nix];ringCfg[nix]=t;saveRings();}
  function colorRing(key,col){if(!ringCfg)loadRings();ringCfg.forEach(function(c){if(c.key===key)c.color=col;});saveRings();}
  function progressCard(){
    var m=homeMetrics();if(!ringCfg)loadRings();
    var RD={
      todo:{lb:"To-do",done:m.todoDone,tot:m.todoTot,vl:m.todoTot?m.todoDone+" of "+m.todoTot:"nothing due"},
      body:{lb:"Body",done:m.bodOk,tot:m.bodTot,vl:m.bodTot?m.bodOk+" of "+m.bodTot+" in range":"nothing set"},
      mind:{lb:"Mind",done:m.mindDone,tot:m.mindTot,vl:m.mindTot?m.mindDone+" of "+m.mindTot:"nothing set"}
    };
    var rings=ringCfg.map(function(c){var r=RD[c.key]||{lb:c.key,done:0,tot:0,vl:""};return {key:c.key,lb:r.lb,col:c.color,done:r.done,tot:r.tot,vl:r.vl};});
    var ds=dayScore(today());var pct=ds?Math.round(ds.r*100):0;
    var size=150,stroke=15,gap=6,cc=size/2;
    var svg='<svg viewBox="0 0 '+size+' '+size+'" aria-hidden="true">';
    rings.forEach(function(r,ix){
      var rad=(size-stroke)/2-ix*(stroke+gap);var c=2*Math.PI*rad;var p=r.tot?Math.min(1,r.done/r.tot):0;
      svg+='<circle class="ring-bg" cx="'+cc+'" cy="'+cc+'" r="'+rad+'" stroke-width="'+stroke+'"></circle>';
      if(r.tot)svg+='<circle cx="'+cc+'" cy="'+cc+'" r="'+rad+'" fill="none" stroke="'+r.col+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(1)+'" transform="rotate(-90 '+cc+' '+cc+')"></circle>';
    });
    svg+='</svg>';
    var leg=rings.map(function(r){return '<div class="rl"><span class="rl-dot" style="background:'+r.col+'"></span><span class="rl-lb">'+r.lb+'</span><span class="rl-vl">'+esc(r.vl)+'</span></div>';}).join("");
    var editor="";
    if(state.editRings){
      editor='<div class="ring-editor">'+rings.map(function(r,ix){
        return '<div class="re-row"><span class="re-name">'+r.lb+'</span><span class="re-sw">'+
          RING_PAL.map(function(c){return '<button class="re-c'+(c.toLowerCase()===(r.col||"").toLowerCase()?" on":"")+'" style="background:'+c+'" data-ringcolor="'+r.key+'|'+c+'" aria-label="set colour"></button>';}).join("")+
          '</span><span class="re-mv"><button data-ringmove="'+r.key+'|-1"'+(ix===0?" disabled":"")+'>↑</button><button data-ringmove="'+r.key+'|1"'+(ix===rings.length-1?" disabled":"")+'>↓</button></span></div>';
      }).join("")+'<p style="color:var(--faint);font-size:11.5px;margin:2px 0 0">Recolour or reorder the three rings. Tap Done when finished.</p></div>';
    }
    var bars=[{lb:"Medication",col:"var(--rust)",done:m.medDone,tot:m.medTot},{lb:"Routine",col:"#5FA0C4",done:m.routDone,tot:m.routTot}]
      .map(function(b){var dots="";for(var di=0;di<b.tot;di++)dots+='<i'+(di<b.done?' style="background:'+b.col+'"':'')+'></i>';
        if(!b.tot)dots='<span class="mbar-empty">none set</span>';
        return '<div class="mbar"><span class="mbar-ic" style="background:'+b.col+'"></span><span class="mbar-lb">'+b.lb+'</span>'+
          '<span class="mbar-dots">'+dots+'</span><span class="mbar-n">'+(b.tot?b.done+"/"+b.tot:"-")+'</span></div>';}).join("");
    return '<div class="card prog-card"><div class="pcard-head"><span class="pcard-title">Progress</span><button class="edit-btn" data-editrings>'+(state.editRings?"Done":"Edit rings")+'</button></div>'+
      '<div class="pcard-top"><div class="rings-wrap">'+svg+'</div>'+
      '<div class="rings-side"><div class="today-row"><span class="today-lab">Today</span><span class="today-pct">'+pct+'%</span></div>'+
      '<div class="obar"><div class="obar-fill" style="width:'+pct+'%"></div></div><div class="rlegend">'+leg+'</div></div></div>'+editor+
      '<div class="bars-block"><div class="bars-h">Medication &amp; routine</div>'+bars+'</div></div>';
  }
  function quoteCard(){
    var qs=[
      ["Discipline is choosing what you want most over what you want now.","on keeping rhythm"],
      ["How we spend our days is, of course, how we spend our lives.","Annie Dillard"],
      ["You do not rise to the level of your goals. You fall to the level of your systems.","James Clear"],
      ["Small disciplines repeated with consistency lead to great achievements.","on steady practice"],
      ["We are what we repeatedly do. Excellence, then, is not an act, but a habit.","Aristotle"],
      ["The best time to plant a tree was twenty years ago. The second best is now.","proverb"],
      ["Motivation gets you going, but discipline keeps you growing.","on the long game"]
    ];
    var d=new Date();var doy=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);var q=qs[doy%qs.length];
    return '<div class="card quote"><span class="mark">“</span><span class="eyebrow">Today’s note</span>'+
      '<blockquote>'+esc(q[0])+'</blockquote><cite>- '+esc(q[1])+'</cite></div>';
  }

    for(var k=period-1;k>=0;k--){

    if(win){lo=Math.min(lo,win.lo);hi=Math.max(hi,win.hi);}
    var Ylo=Math.max(0,lo-40),Yhi=Math.min(1440,hi+40);if(Yhi-Ylo<120)Yhi=Ylo+120;
    function x(idx){return padL+(n<=1?plotW/2:(idx/(n-1))*plotW);}

    var svg="";
    if(win)svg+='<rect x="'+padL+'" y="'+y(win.hi).toFixed(1)+'" width="'+plotW+'" height="'+(y(win.lo)-y(win.hi)).toFixed(1)+'" fill="var(--good)" opacity=".1"/>';
    var startH=Math.ceil(Ylo/60),endH=Math.floor(Yhi/60),step=Math.max(1,Math.round((endH-startH)/4));
    for(var hr=startH;hr<=endH;hr+=step){var yy=y(hr*60);svg+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(padL-8)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--faint)">'+fmtTime(hmFromMin(hr*60))+'</text>';}
    if(timed.length){var avg=timed.reduce(function(s,v){return s+v;},0)/timed.length,ay=y(avg);svg+='<line x1="'+padL+'" y1="'+ay.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ay.toFixed(1)+'" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 4" opacity=".85"/><text x="'+(W-padR)+'" y="'+(ay-5).toFixed(1)+'" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--accent)">avg '+fmtTime(hmFromMin(Math.round(avg)))+'</text>';}

    return '<svg viewBox="0 0 '+W+" "+H+'" style="width:100%;display:block;overflow:visible">'+svg+'</svg>';

           (((r.item.probes||{})[r.k]&&(r.item.probes||{})[r.k].reason)?' \u00b7 you put it down to <b style="color:var(--ink)">'+esc(probeLabel((r.item.probes||{})[r.k].reason))+'</b>':'')+
           (r.level==="persistent"&&r.sev==="urgent"?' · <span style="color:var(--rust)">worth mentioning to a doctor</span>':'')+'</p></div>';

  function exportJSON(){

  function exportDoctor(){
    var L=[],t0=today();
    L.push("RITSU, LOG SUMMARY");
    L.push("Prepared "+dayShort(t0)+" \u00b7 covers the last 30 days");
    L.push("A record of what was logged. It contains no diagnosis and no interpretation.");
    L.push("");
    var body=visibleItems().filter(isBody);
    if(body.length){L.push("BODY LOGS");
      body.forEach(function(i){
        var tot=0,days=0;for(var k=0;k<30;k++){var c=countOn(i,addDaysStr(t0,-k));tot+=c;if(c>0)days++;}
        var r=inRangeRatio(i,30);
        L.push("  "+i.title+", "+tot+" logged over "+days+" of 30 days ("+rangeLabel(i)+"); in usual range "+r.ok+"/30");
        var fl={};for(var q=0;q<30;q++){var ds=addDaysStr(t0,-q);flagsOn(i,ds).forEach(function(f){(fl[f]=fl[f]||[]).push(ds)})}
        Object.keys(fl).forEach(function(f){L.push("      "+mkInfo(f).n+": "+fl[f].length+" day(s), "+fl[f].slice(0,8).join(", "))});
      });L.push("");}
    var meds=visibleItems().filter(function(i){return i.kind==="med"});
    if(meds.length){L.push("MEDICATION");
      meds.forEach(function(i){var n=0;for(var k=0;k<30;k++)if(didOn(i,addDaysStr(t0,-k)))n++;
        L.push("  "+i.title+", taken on "+n+" of the last 30 days ("+Math.round(n/30*100)+"%)"+((i.courseDays||0)>0?"; course "+i.courseDays+" days":""));});
      L.push("");}
    var eps=visibleItems().filter(isEpisode);
    if(eps.some(function(i){return epsOf(i).length})){L.push("EPISODES");
      eps.forEach(function(i){epsOf(i).slice(0,6).forEach(function(e){
        L.push("  "+i.title+", "+epDays(e)+" day(s), "+epRange(e)+(e.end?"":" (ongoing)"));});});
      L.push("");}
    var fasts=visibleItems().filter(isFast);
    if(fasts.length){L.push("FASTING");
      fasts.forEach(function(i){var d=doneFasts(i).filter(function(f){return dCount(fmt(new Date(f.s)))>-30});
        if(d.length)L.push("  "+i.title+", "+d.length+" fasts in 30 days, average "+(fastAvg(i,30)||0)+"h, longest "+Math.round(fastBest(i)*10)/10+"h");});
      L.push("");}
    var f7=patternScan(7).filter(function(r){return LV[r.level]>=2});
    if(f7.length){L.push("PATTERNS IN THE LAST 7 DAYS");
      f7.forEach(function(r){L.push("  ["+r.level+"] "+r.item.title+", "+findingText(r).replace(/<[^>]+>/g,""))});
      L.push("");}
    L.push("Ritsu is a logbook, not a medical device.");
    return L.join("\n");
  }

    h+='<p style="color:var(--muted);font-size:13px;margin:0 0 10px;line-height:1.5">'+(a?"Changes the target for the fast you are in. Nothing already logged is affected.":"How long you aim to go. Longer is not automatically better, pick what you can repeat.")+'</p>';

    h+='<div class="panel" style="margin-top:16px"><h4>What the stages mean</h4><div class="phaselist">'+

        var on=(a&&phaseAt(fastHours(a))===ix);
        return '<div class="plrow '+(on?"on":"")+'"><span class="ph">'+pz[0]+(pz[1]>900?"h+":"-"+pz[1]+"h")+'</span><span class="pd"><b>'+pz[2]+'<span class="evtag '+(pz[4]==="est"?"est":"emg")+'">'+(pz[4]==="est"?"well established":"less settled")+'</span></b><small>'+pz[3]+'</small></span></div>';
      }).join("")+'</div>'+
      '<p style="font-size:12px;color:var(--faint);line-height:1.55;margin:12px 0 0">Ritsu does not chart autophagy. It is real, but when it peaks in humans is not settled, and drawing a confident line would be making it up.</p></div>';

  function cloneEvents(i){var o={};Object.keys(i.events||{}).forEach(function(d){o[d]=(i.events[d]||[]).map(function(e){return {t:e.t,flags:(e.flags||[]).slice(),scale:e.scale==null?null:e.scale,note:e.note||""}})});return o}
  function newEvent(ds){return {t:ds===today()?nowHM():null,flags:[],scale:null,note:""}}

  function addEvent(i,ds){var ev=cloneEvents(i);if(!ev[ds])ev[ds]=[];ev[ds].push(newEvent(ds));var extra={lastDone:ds};
    if(i.kind==="med")extra.stock=Math.max(0,(i.stock||0)-(i.dosesPerDay||1));
    writeEvents(i,ev,extra);}
  function removeEvent(i,ds){var ev=cloneEvents(i);if(!ev[ds]||!ev[ds].length)return;ev[ds].pop();if(!ev[ds].length)delete ev[ds];var extra={};
    if(i.kind==="med")extra.stock=(i.stock||0)+(i.dosesPerDay||1);
    writeEvents(i,ev,extra);}
  function setDayCount(i,ds,n){var ev=cloneEvents(i);var cur=(ev[ds]||[]).length;
    if(n<=0)delete ev[ds];else{if(!ev[ds])ev[ds]=[];while(ev[ds].length>n)ev[ds].pop();while(ev[ds].length<n)ev[ds].push(newEvent(ds));}
    var extra={};if(i.kind==="med"){var diff=(n<=0?0:n)-cur;extra.stock=Math.max(0,(i.stock||0)-diff*(i.dosesPerDay||1));}
    writeEvents(i,ev,extra);}
