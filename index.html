<title>Ritsu</title>
<style>
  :root{

  }
  :root[data-theme="warm"]{
    --bg:#EDE6D8; --panel:#F7F2E9; --panel-2:#F1EADD; --raise:#FBF7EF;
    --ink:#2A2521; --muted:#8B8173; --faint:#B4A995; --line:#E2D8C6; --line-2:#EDE4D4;
    --accent:#3F6B54; --accent-soft:#3f6b5418; --accent-ink:#345c48; --on-accent:#FBF7EF;
    --gold:#A9781F; --gold-soft:#a9781f18; --rust:#B0503A; --rust-soft:#b0503a14; --good:#3F6B54; --good-soft:#3f6b5416;
    --shadow:0 18px 40px -22px rgba(60,45,20,.3); --shadow-sm:0 2px 0 rgba(120,100,60,.05);
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}

  .serif{font-family:var(--serif)}

  .sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;padding:22px 14px;border-right:1px solid var(--line);overflow-y:auto}
  .brand{display:flex;align-items:baseline;gap:9px;padding:2px 8px 18px} .brand b{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:-.01em} .brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .nav-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:16px 10px 6px}
  .nav-btn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 11px;border:0;background:transparent;border-radius:10px;color:var(--muted);font-size:14.5px;font-weight:500;transition:.14s}
  .nav-btn .g{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
  .nav-btn:hover{background:var(--panel);color:var(--ink)} .nav-btn.active{background:var(--accent-soft);color:var(--accent-ink)} .nav-btn.active .g{background:var(--accent)}
  .nav-btn .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)} .nav-btn .count.warn{color:var(--gold)}
  .icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .topbar{display:none} .bottomnav{display:none}

  .day-h .nav{display:flex;gap:6px} .day-h .nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:15px} .day-h .nav button:hover{color:var(--ink);border-color:var(--accent)}

  .today-btn{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px} .today-btn:hover{border-color:var(--accent);color:var(--ink)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

  .tile .top{display:flex;align-items:center;gap:10px} .tile .sw{width:12px;height:12px;border-radius:4px;flex:none;background:var(--tc,var(--accent))} .tile h3{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0} .tile .pct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)} .tile .pct.warn{color:var(--gold)}
  .barwrap{height:6px;border-radius:20px;background:var(--panel-2);overflow:hidden} .barwrap>i{display:block;height:100%;border-radius:20px;background:var(--tc,var(--accent));transition:width .4s}
  .tile .subs{display:flex;flex-wrap:wrap;gap:5px;min-height:20px} .tile .subs span{font-family:var(--mono);font-size:10px;color:var(--faint)} .tile .subs span:not(:last-child):after{content:"·";margin-left:5px;color:var(--line)}
  .stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px} .schip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)} .schip b{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1;display:block} .schip small{font-size:12px;color:var(--muted)} .schip.warn b{color:var(--gold)} .schip.bad b{color:var(--rust)} .schip.good b{color:var(--good)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 18px;box-shadow:var(--shadow-sm)}
  .row{display:flex;align-items:flex-start;gap:13px;padding:14px 0;border-bottom:1px solid var(--line-2);cursor:pointer} .row:last-child{border-bottom:0}
  .tick{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;font-weight:600;color:transparent;background:transparent;transition:.13s} .tick.round{border-radius:50%} .tick:hover{border-color:var(--accent)} .tick.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .tick.part{border-color:var(--accent);color:var(--accent-ink)}
  .rb{flex:1;min-width:0} .rt{font-size:15px;font-weight:500;line-height:1.3;word-break:break-word;display:flex;align-items:center;gap:7px} .rt .lk{color:var(--faint);flex:none} .row.done .rt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
  .rmeta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:7px}
  .time{font-family:var(--mono);font-size:10.5px;color:var(--muted)} .time.accent{color:var(--accent-ink)}
  .tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted)} .tag .dot{width:7px;height:7px;border-radius:50%}
  .streak{font-family:var(--mono);font-size:10.5px;color:var(--gold);display:inline-flex;align-items:center;gap:4px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted)} .pill.rep{background:var(--accent-soft);color:var(--accent-ink)} .pill.hi{background:var(--rust-soft);color:var(--rust)} .pill.due.soon{background:var(--gold-soft);color:var(--gold)} .pill.due.over{background:var(--rust-soft);color:var(--rust)} .pill.warnflag{background:var(--rust-soft);color:var(--rust)}
  .rright{margin-left:auto;flex:none;display:flex;align-items:center;gap:11px;padding-left:6px} .days{font-family:var(--mono);font-size:12px;font-weight:500} .days.ok{color:var(--good)} .days.warn{color:var(--gold)} .days.bad{color:var(--rust)}
  .mini-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap} .mini-btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .mval{text-align:right} .mval b{font-family:var(--serif);font-weight:600;font-size:18px} .mval b.hit{color:var(--good)} .mval small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
  .avatars{display:flex} .avatars .av{margin-left:-6px;border:2px solid var(--panel)} .avatars .av:first-child{margin-left:0}
  .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none} .av.lg{width:30px;height:30px;font-size:13px} .av.sm{width:20px;height:20px;font-size:10px} .av.more{background:var(--panel-2);color:var(--muted);font-family:var(--mono);font-size:10px}
  .sub{margin-top:20px} .sub-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;padding-left:2px}
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px} .chip{font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:inline-flex;align-items:center;gap:6px} .chip:hover{color:var(--ink)} .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)} .chip .dot{width:7px;height:7px;border-radius:50%}
  .back{display:inline-flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--muted);font-size:13px;font-weight:600;padding:0;margin-bottom:12px} .back:hover{color:var(--ink)}
  .area-top{display:flex;align-items:center;gap:13px;margin-bottom:16px} .area-top .sw{width:16px;height:34px;border-radius:6px;flex:none;background:var(--tc,var(--accent))}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:13.5px;white-space:nowrap} .btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)} .btn.primary:hover{filter:brightness(1.06)} .btn.sm{padding:7px 12px;font-size:12.5px} .btn.ghost{background:transparent} .btn.danger{color:var(--rust);border-color:var(--rust-soft)} .btn.danger:hover{background:var(--rust-soft);border-color:var(--rust)}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0} .statbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;text-align:center;box-shadow:var(--shadow-sm)} .statbox b{display:block;font-family:var(--serif);font-weight:600;font-size:25px;line-height:1} .statbox small{font-size:11.5px;color:var(--muted)} .statbox.flame b{color:var(--gold)} .statbox.good b{color:var(--good)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)} .panel h4{font-family:var(--serif);font-weight:600;font-size:15px;margin:0 0 14px}
  .dots7{display:flex;gap:8px;flex-wrap:wrap} .dot7{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer} .dot7 .d{width:30px;height:30px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;font-size:12px;color:transparent;border:1px solid var(--line)} .dot7 .d.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .dot7:hover .d{border-color:var(--accent)} .dot7 small{font-family:var(--mono);font-size:9px;color:var(--faint);text-transform:uppercase}
  .heat{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px} .heatcol{display:flex;flex-direction:column;gap:4px} .heatcell{width:14px;height:14px;border-radius:4px;background:var(--panel-2);cursor:pointer;border:1px solid var(--line-2)} .heatcell.on{background:var(--accent);border-color:var(--accent)} .heatcell.fut{opacity:.3;cursor:default} .heatlbl{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:8px;display:flex;justify-content:space-between}
  .freq{display:flex;align-items:flex-end;gap:9px;height:76px} .freqbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end} .freqbar .fb{width:100%;max-width:26px;border-radius:6px 6px 0 0;background:var(--accent);min-height:3px} .freqbar small{font-family:var(--mono);font-size:9px;color:var(--faint)}
  .mbars{display:flex;align-items:flex-end;gap:6px;height:64px} .mbars .mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end} .mbars .mb i{width:100%;max-width:22px;border-radius:5px 5px 0 0;background:var(--panel-2);min-height:2px} .mbars .mb i.hit{background:var(--good)} .mbars .mb small{font-family:var(--mono);font-size:8.5px;color:var(--faint)}
  .rtabs{display:inline-flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px} .rtabs button{border:0;background:transparent;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 13px;border-radius:999px} .rtabs button.on{background:var(--raise);color:var(--ink);box-shadow:var(--shadow-sm)}
  .bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px} .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;min-width:0} .bars .b i{width:100%;max-width:38px;border-radius:6px 6px 3px 3px;background:var(--accent)} .bars .b i.low{opacity:.32} .bars .b small{font-family:var(--mono);font-size:9.5px;color:var(--faint);white-space:nowrap}
  .tod{display:flex;gap:8px;margin-top:6px} .tod .t{flex:1;text-align:center;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 8px} .tod .t b{font-family:var(--serif);font-weight:600;font-size:20px;display:block} .tod .t small{font-size:10.5px;color:var(--muted)}
  .abn{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)} .abn:last-child{border:0} .abn .d{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:64px} .abn .t{flex:1} .abn .c{font-family:var(--mono);font-size:12px;color:var(--rust);font-weight:600}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)} .empty h3{font-family:var(--serif);font-weight:600;color:var(--ink);margin:0 0 6px;font-size:19px} .empty p{margin:0 auto 16px;max-width:330px;font-size:14px}
  .cat-empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--faint);font-size:13px;text-align:center;margin-top:12px}
  .people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px} .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-sm)} .pcard .who b{display:block;font-weight:600;font-size:15px} .pcard .who small{font-family:var(--mono);font-size:11px;color:var(--faint)} .pcard .x{margin-left:auto;background:transparent;border:0;color:var(--faint);font-size:15px;padding:4px} .pcard .x:hover{color:var(--rust)}
  .setrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line-2)} .setrow:last-child{border-bottom:0} .setrow .info{flex:1} .setrow .info b{font-size:14.5px;font-weight:600} .setrow .info small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .themetoggle{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px} .themetoggle button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px} .themetoggle button.on{background:var(--accent);color:var(--on-accent)}

  .overlay{position:fixed;inset:0;background:#0008;backdrop-filter:blur(4px);display:grid;place-items:end center;z-index:60;opacity:0;pointer-events:none;transition:.18s} .overlay.show{opacity:1;pointer-events:auto}

  /* ===== stances, markers, patterns ===== */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:3px;text-align:left}
  .kpi b{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .kpi small{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .kpi.warn b{color:var(--gold)} .kpi.bad b{color:var(--rust)} .kpi.good b{color:var(--good)}
  .kpi .spark{display:flex;align-items:flex-end;gap:2px;height:18px;margin-top:6px}
  .kpi .spark i{flex:1;background:var(--accent);border-radius:1.5px;min-height:2px;opacity:.5} .kpi .spark i.hi{opacity:1}

  .stance-chip{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid;white-space:nowrap}
  .stance-chip.routine{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
  .stance-chip.body{color:var(--muted);border-color:var(--line);background:var(--panel-2)}
  .stance-chip.limit{color:var(--rust);border-color:var(--rust);background:var(--rust-soft)}
  .stance-chip.episode{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
  .stance-chip.fast{color:var(--good);border-color:var(--good);background:var(--good-soft)}

  .strip{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
  .strip .sh{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .strip .sh h3{font-family:var(--serif);font-weight:600;font-size:17px;margin:0}
  .strip .sh .note{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .strip .sh .note.warn{color:var(--gold)}
  .lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
  .lrow:last-child{border-bottom:0} .lrow:first-of-type{padding-top:12px}
  .lrow .nm{flex:1;min-width:0;font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .lrow .cnt b{color:var(--ink);font-weight:600;font-family:var(--serif);font-size:15px}
  .lrow .cnt.slipped b{color:var(--rust)}
  .lrow .rngbar{width:52px;height:5px;border-radius:20px;background:var(--panel-2);overflow:hidden;flex:none}
  .lrow .rngbar>i{display:block;height:100%;background:var(--good)} .lrow .rngbar>i.out{background:var(--gold)}
  .logbtn{flex:none;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:9px;padding:5px 11px;font-family:var(--mono);font-size:11px}
  .logbtn:hover{border-color:var(--rust);color:var(--rust)}

  .mstrip{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:11px 0 13px;border-bottom:1px solid var(--line-2);animation:mfade .22s ease}
  @keyframes mfade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .mstrip .ask{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--faint);margin-right:2px}
  .mchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted)}
  .mchip .d{width:6px;height:6px;border-radius:50%;background:var(--faint)}
  .mchip.w .d{background:var(--gold)} .mchip.u .d{background:var(--rust)}
  .mchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
  .mchip.on.u{border-color:var(--rust);background:var(--rust-soft);color:var(--rust)}

  .flagpill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel-2)}
  .flagpill.w{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
  .flagpill.u{color:var(--rust);border-color:var(--rust);background:var(--rust-soft)}

  .find{padding:15px 0;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
  .find:last-child{border-bottom:0;padding-bottom:2px}
  .find .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .find .top .who{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .find .say{font-size:14.5px;line-height:1.5;margin:0} .find .say b{font-weight:600}
  .find .tr{font-family:var(--mono);font-size:11px;color:var(--faint);margin:0;line-height:1.5}
  .find .tr .up{color:var(--rust)} .find .tr .dn{color:var(--good)}
  .lvl{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid}
  .lvl.noted{color:var(--muted);border-color:var(--line);background:var(--panel-2)}
  .lvl.recurring{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
  .lvl.persistent{color:var(--rust);border-color:var(--rust);background:var(--rust-soft)}

  .heatcell.slip{background:var(--rust)} .heatcell.mid{background:var(--good)}
  .heatcell.out{background:var(--gold)} .heatcell.flag{background:var(--rust);box-shadow:inset 0 0 0 1.5px var(--panel)}
  .heatlegend{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
  .heatlegend span{display:inline-flex;align-items:center;gap:5px}
  .heatlegend i{width:9px;height:9px;border-radius:3px;display:inline-block;background:var(--panel-2)}
  .dot7 .d.mid{background:var(--good);border-color:var(--good);color:var(--on-accent)}
  .dot7 .d.slip{background:var(--rust);border-color:var(--rust);color:var(--on-accent)}
  .dot7 .d.out{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}

  .noticed{display:flex;flex-direction:column;gap:0}
  .nrow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .nrow:last-child{border-bottom:0}
  .nrow .nb{flex:1;min-width:0}
  .nrow .nb b{font-size:14px;font-weight:600;display:block}
  .nrow .nb small{font-family:var(--mono);font-size:10.5px;color:var(--faint);display:block;margin-top:3px;line-height:1.6}
  .nrow .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---- combined consistency calendar: one cell per day, shaded by how much of
     that day's daily routine you finished. Sequential, single hue, light to dark. ---- */
  .cal{margin-top:2px}
  .calscroll{overflow-x:auto;padding-bottom:4px}
  .calgrid{display:inline-flex;flex-direction:column;gap:4px;min-width:100%}
  .calmons{display:flex;gap:3px;height:13px;padding-left:26px}
  .calmons span{font-family:var(--mono);font-size:9px;color:var(--faint);flex:none;line-height:1;letter-spacing:.04em}
  .calbody{display:flex;gap:3px}
  .caldays{display:flex;flex-direction:column;gap:3px;flex:none;width:23px;padding-right:3px}
  .caldays span{height:13px;font-family:var(--mono);font-size:8.5px;color:var(--faint);line-height:13px}
  .calcols{display:flex;gap:3px}
  .calcol{display:flex;flex-direction:column;gap:3px}
  .calcell{width:13px;height:13px;border-radius:3.5px;background:var(--panel-2);flex:none;border:1px solid transparent}
  .calcell.s1{background:var(--good);opacity:.2}
  .calcell.s2{background:var(--good);opacity:.42}
  .calcell.s3{background:var(--good);opacity:.68}
  .calcell.s4{background:var(--good);opacity:1}
  .calcell.today{border-color:var(--accent)}

  .callegend{display:flex;align-items:center;gap:7px;margin-top:12px;font-family:var(--mono);font-size:9.5px;color:var(--faint);flex-wrap:wrap}
  .callegend .sw{width:13px;height:13px;border-radius:3.5px;background:var(--panel-2);display:inline-block}
  .callegend .sw.s1{background:var(--good);opacity:.2} .callegend .sw.s2{background:var(--good);opacity:.42}
  .callegend .sw.s3{background:var(--good);opacity:.68} .callegend .sw.s4{background:var(--good);opacity:1}
  .callegend .gap{flex:1;min-width:6px}

  .todo-add{display:flex;align-items:center;gap:11px;width:100%;padding:13px 0 3px;border:0;background:transparent;color:var(--muted);font-size:14px;text-align:left}
  .todo-add .pl{width:22px;height:22px;border-radius:6px;border:1.6px dashed var(--faint);display:grid;place-items:center;font-size:13px;flex:none}
  .todo-add:hover{color:var(--accent-ink)} .todo-add:hover .pl{border-color:var(--accent);color:var(--accent)}

  .pcard{align-items:flex-start} .pcard .who{flex:1;min-width:0}

  .rngrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .privline{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--muted);line-height:1.5;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:4px}
  .privline b{color:var(--ink);font-weight:600}

  @media(max-width:820px){
    .kpis{grid-template-columns:1fr 1fr;gap:8px} .kpi{padding:12px 13px} .kpi b{font-size:22px}
    .rngrow{grid-template-columns:1fr}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ============================================================
     One type family, size and weight for hierarchy, sentence case.
     Purple accent; green and coral kept strictly for status.
     ============================================================ */
  :root{
    --bg:#0E0C13; --panel:#16131F; --panel-2:#1D1928; --raise:#241F31;
    --ink:#EFECF5; --muted:#9E97AE; --faint:#6A637A; --line:#282235; --line-2:#201B2B;
    --accent:#A78BFA; --accent-soft:#a78bfa1c; --accent-ink:#BCA4FF; --on-accent:#150E26;
    --gold:#E9B949; --gold-soft:#e9b94916; --rust:#F0806B; --rust-soft:#f0806b16;
    --good:#5FD3A6; --good-soft:#5fd3a616;
    --shadow:0 24px 56px -28px rgba(0,0,0,.78); --shadow-sm:0 1px 0 rgba(0,0,0,.25);
    --ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    --serif:var(--ui); --sans:var(--ui); --mono:var(--ui);
  }
  :root[data-theme="warm"]{
    --bg:#F4F2F9; --panel:#FFFFFF; --panel-2:#F2EFF9; --raise:#FFFFFF;
    --ink:#1B1726; --muted:#6A6380; --faint:#9B94AC; --line:#E5E0F0; --line-2:#EFEBF7;
    --accent:#6D4AE0; --accent-soft:#6d4ae012; --accent-ink:#5B3BC9; --on-accent:#FFFFFF;
    --gold:#A97810; --gold-soft:#a9781012; --rust:#C4533A; --rust-soft:#c4533a10;
    --good:#2F9E75; --good-soft:#2f9e7512;
    --shadow:0 18px 44px -24px rgba(40,20,90,.20); --shadow-sm:0 1px 0 rgba(60,40,110,.05);
  }

  body{font-size:15.5px;letter-spacing:-.006em;font-feature-settings:"cv05","ss01"}
  h1.title{font-weight:700;letter-spacing:-.035em;line-height:1.04}
  h2,h3,h4,.modal-h h3,.empty h3,.strip .sh h3,.tile h3{font-weight:600;letter-spacing:-.018em}
  .brand b,.topbar b{font-weight:700;letter-spacing:-.03em}
  .kpi b,.statbox b,.schip b,.day-h .prog b,.tod .t b,.pcard .pct,.lrow .cnt b,.bignum input,.mval b,.nrow .n,.find .say,.time,.days,.calmons span,.caldays span,.heatlbl,.streak,.kpi .sub,.rule .cond{font-variant-numeric:tabular-nums}
  .kpi b,.statbox b,.schip b,.day-h .prog b,.tod .t b,.pcard .pct{font-weight:660;letter-spacing:-.03em}

  /* the all-caps mono label was the loudest generic tell — sentence case everywhere */
  .kicker,.nav-label,.sub-label,.field>label,.kpi small,.statbox small,.schip small,.tod .t small,
  .callegend,.heatlbl,.stance-chip,.lvl,.flagpill,.rtabs button,.bottomnav button,.strip .sh .note,
  .mini-btn,.chip,.tag,.pill,.streak,.days,.tagpick,.mchip,.time,.pcard .who small,.tagline .n,
  .mstrip .ask,.logbtn,.todo-add,.calmons span,.caldays span,.field .hint,.freqbar small,.mbars .mb small,
  .bars .b small,.abn .d,.abn .c,.find .tr,.find .top .who,.rule .k,.eyebrow{
    text-transform:none;letter-spacing:0;font-family:var(--ui)
  }
  .brand span,.me-btn .who small,.day-h .prog small,.dot7 small,.tile .pct,.sec-h .meta,.report .rh span,
  .heat + .heatlbl,.statbox b small,.abn .t,.setrow .info small,.pcard .who small{text-transform:none;letter-spacing:0;font-family:var(--ui)}
  .day-h .prog small{font-size:12.5px;font-weight:500;color:var(--muted)}
  .brand span{font-size:12px} .me-btn .who small{font-size:12px} .dot7 small{font-size:11px}
  .kicker{font-size:12.8px;color:var(--muted);letter-spacing:-.002em}
  .field>label{font-size:12px;font-weight:500;color:var(--muted)}
  .sub-label{font-size:12px;font-weight:500;color:var(--faint)}

  function normalizeItem(v){

    if(v.kind==null)v.kind="todo";

    if(v.stance!=="body"&&v.stance!=="limit"&&v.stance!=="episode"&&v.stance!=="fast")v.stance="routine";
    if(!Array.isArray(v.fasts))v.fasts=[];

  function metOn(i,ds){if(i.kind==="todo"&&isRepeat(i))return countOn(i,ds)>=perDayOf(i);return didOn(i,ds)}
  function doneOn(i,ds){return didOn(i,ds)}
  function abnormalOn(i,ds){return i.kind==="todo"&&isRepeat(i)&&countOn(i,ds)>perDayOf(i)}
  function lastDoneOf(i){if(i.kind==="todo"){var ks=Object.keys(i.counts||{}).filter(function(k){return i.counts[k]>0});ks.sort();return ks.length?ks[ks.length-1]:null;}if(i.kind==="med"){var l=(i.log||[]).slice().sort();return l.length?l[l.length-1]:null;}return i.lastDone||null}
  function nextDue(i){if(i.kind==="todo"){if(isRepeat(i)){var ld=lastDoneOf(i);return ld?addDaysStr(ld,i.repeatEvery):today();}return i.dueDate||null;}if(i.kind==="measure"||i.kind==="med"){var ld2=lastDoneOf(i);return ld2?addDaysStr(ld2,i.repeatEvery||1):today();}return addDaysStr(i.lastDone||i.createdDate||today(),i.intervalDays||30)}
  function doneForNow(i){if(i.kind==="measure")return measureHit(i,today());if(i.kind==="med")return didOn(i,today());if(i.kind==="todo"){if(isRepeat(i))return metOn(i,today());return !!i.done;}return dCount(nextDue(i))>0}
  function onToday(i){if(isLimit(i)||isEpisode(i)||isFast(i))return false;if(i.kind==="measure"||i.kind==="med")return true;if(i.kind!=="todo")return false;if(isRepeat(i))return metOn(i,today())||dCount(nextDue(i))<=0;return i.dueDate!=null&&dCount(i.dueDate)<=0}
  function medLow(i){return (i.reorderTablets>0&&(i.stock||0)<=i.reorderTablets)||(i.reorderAt>0&&medDaysLeft(i)<=i.reorderAt)}
  function attention(i){
    if(isLimit(i)||isBody(i)||isEpisode(i)||isFast(i))return null; /* these are never "overdue" — nothing was promised */
    if(i.kind==="todo"){var nd=nextDue(i);if(nd==null||doneForNow(i))return null;return dCount(nd)<0?{sev:"over"}:null;}
    if(i.kind==="med"){if(medDaysLeft(i)<=0||(i.stock||0)<=0)return{sev:"over"};if(medLow(i))return{sev:"soon"};var cl=medCourseLeft(i);if(cl!=null&&cl<=3&&cl>=0)return{sev:"soon"};return null;}
    if(i.kind==="measure")return null;
    var d2=dCount(nextDue(i));if(d2<=0)return{sev:"over"};if(d2<=7)return{sev:"soon"};return null;
  }
  function effDate(i){if(i.kind==="med"){var dl=medDaysLeft(i);return dl<=7?addDaysStr(today(),Math.max(0,dl)):null;}if(i.kind==="todo"||i.kind==="measure"){if(doneForNow(i))return null;return nextDue(i);}return nextDue(i)}
  function trackable(i){return i.kind==="measure"||i.kind==="med"||(i.kind==="todo"&&isRepeat(i))}
  function streakOf(i){
    if(isEpisode(i)||isFast(i))return 0;
    if(isLimit(i))return cleanStreak(i);      /* consecutive days WITHOUT */
    if(isBody(i))return 0;                    /* a bowel movement is not an achievement */
    if(!trackable(i))return 0;var step=i.repeatEvery||1;var d=today();if(!didOn(i,d))d=addDaysStr(d,-step);var c=0,g=0;while(didOn(i,d)&&g<3660){c++;d=addDaysStr(d,-step);g++;}return c}
  function bestStreakOf(i){
    if(isLimit(i))return bestCleanStreak(i);
    if(isBody(i)||isEpisode(i)||isFast(i))return 0;
    if(!trackable(i))return 0;var dates=[];if(i.kind==="measure"){for(var k in(i.values||{}))if(measureHit(i,k))dates.push(k);}else if(i.kind==="todo"){dates=Object.keys(i.counts||{}).filter(function(k){return i.counts[k]>0});}else dates=(i.log||[]).slice();dates.sort();var step=i.repeatEvery||1,best=0,cur=0,prev=null;dates.forEach(function(ds){if(prev&&dCount(ds)-dCount(prev)===step)cur++;else cur=1;if(cur>best)best=cur;prev=ds;});return best}
  function completionTime(i,ds){if(i.kind==="todo"&&!isRepeat(i))return i.completedAt?(""+i.completedAt).slice(11,16):null;return (i.logTimes||{})[ds]||null}

  /* ================= stance-aware logic ================= */
  function stanceOf(i){return i.stance||"routine"}
  function isEpisode(i){return stanceOf(i)==="episode"}
  function isFast(i){return stanceOf(i)==="fast"}
  /* ---- fasting: a live window, not a daily tick ---- */
  var PROTOCOLS=[
    {h:12,g:"Daily rhythm",n:"Gentle"},{h:14,g:"Daily rhythm",n:"Easing in"},{h:16,g:"Daily rhythm",n:"Standard"},
    {h:18,g:"Daily rhythm",n:"Focused"},{h:20,g:"Daily rhythm",n:"Tight window"},
    {h:22,g:"One meal a day",n:"OMAD+"},{h:23,g:"One meal a day",n:"OMAD"},
    {h:24,g:"Extended",n:"One full day",ext:1},{h:36,g:"Extended",n:"Day and a half",ext:1},
    {h:48,g:"Extended",n:"Two days",ext:1},{h:72,g:"Extended",n:"Three days",ext:1}
  ];
  /* Stages are named for elapsed time and tagged for how settled the science is.
     Nothing here is a health claim, and autophagy timing is deliberately not charted \u2014
     the human evidence for when it peaks is not settled. */
  var FPHASES=[
    [0,4,"Fed","Food is still being absorbed; insulin is high.","est"],
    [4,12,"Early","Running mostly on glycogen stored in the liver.","est"],
    [12,16,"Fat-burn","Glycogen thins out and more energy comes from fat.","est"],
    [16,24,"Ketosis","Ketones rise and take a bigger share of the fuel.","est"],
    [24,48,"Deep","Ketones high. Water and electrolytes start to matter.","emg"],
    [48,999,"Prolonged","Past two days. This is medical-supervision territory.","emg"]
  ];
  function phasesFor(target){
    var lim=Math.max(target||16,12),out=[];
    for(var q=0;q<FPHASES.length;q++){out.push(FPHASES[q]);if(FPHASES[q][0]>=lim)break;}
    return out;
  }
  function activeFast(i){return (i.fasts||[]).filter(function(f){return !f.e})[0]||null}
  function doneFasts(i){return (i.fasts||[]).filter(function(f){return f.e}).sort(function(a,b){return b.s-a.s})}
  function fastHours(f){return ((f.e||Date.now())-f.s)/3600000}
  function fmtHM(h){var m=Math.max(0,Math.round(h*60));return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"}
  function targetOf(i){var a=activeFast(i);return (a&&a.target)||(i.protocol&&i.protocol.fast)||16}
  function startFast(i,target){
    if(activeFast(i))return;
    var fs=(i.fasts||[]).slice();fs.push({s:Date.now(),e:null,target:target||(i.protocol&&i.protocol.fast)||16});
    Store.update("items",i.id,{fasts:fs});
  }
  function endFast(i){
    var fs=(i.fasts||[]).map(function(f){return Object.assign({},f)});
    var a=fs.filter(function(f){return !f.e})[0];if(!a)return 0;
    a.e=Date.now();Store.update("items",i.id,{fasts:fs});return fastHours(a);
  }
  function fastAvg(i,n){var d=doneFasts(i).slice(0,n||14);if(!d.length)return null;
    var t=0;d.forEach(function(f){t+=fastHours(f)});return Math.round(t/d.length*10)/10}
  function fastBest(i){var b=0;doneFasts(i).forEach(function(f){var h=fastHours(f);if(h>b)b=h});return b}
  function fastOnDay(i,ds){var out=0;(i.fasts||[]).forEach(function(f){
    var d=new Date(f.s);var k=fmt(d);if(k===ds){var h=fastHours(f);if(h>out)out=h;}});return out}
  function anyActiveFast(){return Store.all("items").some(function(i){return isFast(i)&&activeFast(i)})}
  function phaseAt(h){for(var q=0;q<FPHASES.length;q++)if(h>=FPHASES[q][0]&&h<FPHASES[q][1])return q;return FPHASES.length-1}
  function phaseBar(target,elapsed){
    var ps=phasesFor(target),cur=(elapsed==null?-1:phaseAt(elapsed));
    var cap=Math.max(target,ps[ps.length-1][0]+4);
    return '<div class="phasebar">'+ps.map(function(pz,ix){
      var w=Math.min(pz[1],cap)-pz[0];
      return '<div class="phaseseg '+(ix===cur?"on":(ix<cur?"done":""))+'" style="flex:'+Math.max(1,w)+'"><small>'+pz[2]+'</small></div>';
    }).join("")+'</div>';
  }
  function protoLabel(h){return h>=24?(h+"h"):(h+":"+(24-h))}
  function isExtended(i){return targetOf(i)>=24}
  function extAcked(){try{return localStorage.getItem("ritsu_ext_ack")==="1"}catch(e){return false}}
  function ackExt(){try{localStorage.setItem("ritsu_ext_ack","1")}catch(e){}}
  function careBox(){
    return '<div class="carebox"><b>While you are past a day</b><p>Keep drinking, and add a pinch of salt to one glass \u2014 most trouble on a long fast is water and electrolytes, not hunger. '+
      '<b style="display:inline;color:var(--ink)">Stop and eat</b> if you feel faint, dizzy, confused, or your heart is racing. If that does not settle quickly, get medical help.</p></div>';
  }

  /* ---- three concentric rings: one per stance. The whole model in one glyph. ---- */
  function activityRings(size){
    var tp=todayProg();
    var bod=visibleItems().filter(isBody),lim=visibleItems().filter(isLimit);
    var bOk=bod.filter(function(i){return countOn(i,today())>0&&inRangeOn(i,today())&&!flagsOn(i,today()).length}).length;
    var lOk=lim.filter(function(i){return countOn(i,today())===0}).length;
    var rows=[
      {pct:tp.total?tp.done/tp.total:null,col:"var(--accent)",lb:"Routine",vl:tp.total?tp.done+" of "+tp.total:"nothing set",on:tp.total>0},
      {pct:bod.length?bOk/bod.length:null,col:"var(--good)",lb:"Body",vl:bod.length?bOk+" of "+bod.length+" in range":"nothing set",on:bod.length>0},
      {pct:lim.length?lOk/lim.length:null,col:"var(--rust)",lb:"Holding off",vl:lim.length?(lOk===lim.length?"all clear today":(lim.length-lOk)+" logged today"):"nothing set",on:lim.length>0}
    ];
    var stroke=Math.round(size*0.093),gap=Math.round(stroke*0.5);
    var svg='<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" aria-hidden="true">';
    rows.forEach(function(r,ix){
      var rad=(size-stroke)/2-ix*(stroke+gap);var c=2*Math.PI*rad;
      svg+='<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+rad+'" fill="none" stroke="'+r.col+'" stroke-opacity="0.15" stroke-width="'+stroke+'"></circle>';
      if(r.pct!=null)svg+='<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+rad+'" fill="none" stroke="'+r.col+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-Math.min(1,r.pct))).toFixed(1)+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"></circle>';
    });
    svg+='</svg>';
    var leg='<div class="ringlegend">'+rows.map(function(r){
      return '<div class="lgrow '+(r.on?"":"off")+'"><span class="dot" style="background:'+r.col+';opacity:'+(r.on?1:.35)+'"></span><span class="lb">'+r.lb+'</span><span class="vl">'+esc(r.vl)+'</span></div>';
    }).join("")+'</div>';
    return '<div class="rings">'+svg+leg+'</div>';
  }

  /* ---- today on a time axis, from the expected times ---- */
  function todayTimeline(){
    var now=minsOf(nowHM());
    function whenOf(i){return expectOf(i)||(i.reminder?{at:i.reminder,slack:90,dir:"either"}:null)}
    var its=visibleItems().filter(function(i){return !isEpisode(i)&&!isFast(i)&&whenOf(i)});
    if(its.length<2)return "";
    its.sort(function(a,b){return minsOf(whenOf(a).at)-minsOf(whenOf(b).at)});
    var placed=false,h='<div class="panel"><h4>Today, in order</h4><div class="tline">';
    its.forEach(function(i){
      var at=minsOf(whenOf(i).at);
      if(!placed&&at>now){h+='<div class="nowline"><span class="nt">'+esc(fmtTime(nowHM()))+'</span><span class="nk"><i></i></span><span class="nr"></span></div>';placed=true;}
      var logged=(i.kind==="measure")?((i.values||{})[today()]!=null):countOn(i,today())>0;
      var dr=logged?driftOn(i,today()):null;
      var late=(!logged&&at<now-(whenOf(i).slack==null?60:whenOf(i).slack));
      var t=logged?(completionTime(i,today())||((evOn(i,today()).slice(-1)[0]||{}).t)):null;
      h+='<div class="trow '+(logged?"done":(late?"late":""))+'"><span class="tt">'+esc(fmtTime(whenOf(i).at))+'</span>'+
        '<span class="tk"><i></i></span>'+
        '<span class="tn" data-open="'+i.id+'">'+esc(i.title)+'</span>'+
        '<span class="ts '+(dr?"late":"")+'">'+(logged?(t?esc(fmtTime(t)):"done")+(dr?" \u00b7 "+fmtMins(dr.mins)+(dr.mins>0?" late":" early"):""):(late?"not yet":""))+'</span></div>';
    });
    if(!placed)h+='<div class="nowline"><span class="nt">'+esc(fmtTime(nowHM()))+'</span><span class="nk"><i></i></span><span class="nr"></span></div>';
    return h+'</div></div>';
  }

  /* ---- one SVG ring, used for the day and for a running fast ---- */
  function ringSVG(pct,size,stroke,big,sub,cls){
    var r=(size-stroke)/2,c=2*Math.PI*r;
    var off=c*(1-Math.max(0,Math.min(1,pct||0)));
    return '<div class="ringwrap '+(cls||"")+'" style="width:'+size+'px;height:'+size+'px">'+
      '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" aria-hidden="true">'+
      '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--panel-2)" stroke-width="'+stroke+'"></circle>'+
      '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"></circle>'+
      '</svg><div class="rin"><b>'+big+'</b><small>'+sub+'</small></div></div>';
  }
  /* ---- the fourth anomaly: when something happens, not whether ---- */
  function minsOf(t){var q=(""+t).split(":");return (+q[0])*60+(+(q[1]||0))}
  function fmtMins(m){m=Math.abs(Math.round(m));var hh=Math.floor(m/60),mm=m%60;
    return hh?(hh+"h"+(mm?" "+mm+"m":"")):(mm+" min"+(mm===1?"":"s"))}
  function expectOf(i){return (i.expect&&i.expect.at)?i.expect:null}
  function wrapDiff(d){if(d<-720)d+=1440;if(d>720)d-=1440;return d}
  function driftOn(i,ds){
    var ex=expectOf(i);if(!ex)return null;
    var evs=evOn(i,ds).filter(function(e){return e.t});if(!evs.length)return null;
    var t=evs[evs.length-1].t;
    var d=wrapDiff(minsOf(t)-minsOf(ex.at));
    var slack=(ex.slack==null?60:ex.slack);
    var dir=ex.dir||"either";
    if(dir==="late"&&d<=slack)return null;
    if(dir==="early"&&d>=-slack)return null;
    if(dir==="either"&&Math.abs(d)<=slack)return null;
    return {mins:d,t:t};
  }
  function epsOf(i){return (i.episodes||[]).slice().sort(function(a,b){return (a.start<b.start)?1:-1})}
  function activeEp(i){return (i.episodes||[]).filter(function(e){return !e.end})[0]||null}
  function epDays(e){var end=e.end||today();return Math.abs(dCount(end)-dCount(e.start))+1}
  function epAvg(i){var done=epsOf(i).filter(function(e){return e.end});if(!done.length)return null;
    var t=0;done.forEach(function(e){t+=epDays(e)});return Math.round(t/done.length*10)/10}
  function epRange(e){var a=new Date(e.start+"T00:00:00");var b=new Date((e.end||today())+"T00:00:00");
    return MON[a.getMonth()]+" "+a.getDate()+(e.end?" \u2013 "+MON[b.getMonth()]+" "+b.getDate():"")}
  function startEpisode(i){var eps=(i.episodes||[]).slice();if(activeEp(i))return;
    eps.push({start:today(),end:null,flags:{},note:""});Store.update("items",i.id,{episodes:eps});}
  function endEpisode(i){var eps=(i.episodes||[]).map(function(e){return Object.assign({},e)});
    var a=eps.filter(function(e){return !e.end})[0];if(!a)return;a.end=today();Store.update("items",i.id,{episodes:eps});}
  function epFlagsOn(i,ds){var a=activeEp(i)||epsOf(i)[0];if(!a)return[];return (a.flags||{})[ds]||[]}
  function toggleEpFlag(i,f){var eps=(i.episodes||[]).map(function(e){return Object.assign({},e,{flags:Object.assign({},e.flags||{})})});
    var a=eps.filter(function(e){return !e.end})[0];if(!a)return;
    var cur=(a.flags[today()]||[]).slice();var ix=cur.indexOf(f);if(ix>-1)cur.splice(ix,1);else cur.push(f);
    if(cur.length)a.flags[today()]=cur;else delete a.flags[today()];
    Store.update("items",i.id,{episodes:eps});}

  /* partial credit: 50 pages of a 100-page goal is half a tick, not zero */
  function creditOn(i,ds){
    if(i.kind==="measure"){var v=(i.values||{})[ds];if(v==null)return 0;var t=i.target||0;if(t<=0)return v!=null?1:0;return Math.max(0,Math.min(1,v/t));}
    if(i.kind==="todo"&&isRepeat(i)){var pd=Math.max(1,normOf(i).max||perDayOf(i));return Math.max(0,Math.min(1,countOn(i,ds)/pd));}
    return metOn(i,ds)?1:0;
  }
  function isRoutine(i){return stanceOf(i)==="routine"}
  function isBody(i){return stanceOf(i)==="body"}
  function isLimit(i){return stanceOf(i)==="limit"}
  function logged(i){return i.kind==="todo"||i.kind==="med"}
  /* items that carry a day-by-day pattern worth scanning */
  function scannable(i){return !isEpisode(i)&&!isFast(i)&&logged(i)&&(isRepeat(i)||i.kind==="med"||isBody(i)||isLimit(i))}

  function normOf(i){var n=i.normal||{};return {min:n.min,max:n.max,gap:n.maxGapDays,week:n.maxPerWeek}}
  function inRangeOn(i,ds){
    var N=normOf(i),c=countOn(i,ds);
    if(N.min!=null&&c<N.min)return false;
    if(N.max!=null&&c>N.max)return false;
    return true;
  }
  function inRangeRatio(i,days){var ok=0;for(var k=0;k<days;k++){if(inRangeOn(i,addDaysStr(today(),-k))&&!flagsOn(i,addDaysStr(today(),-k)).length)ok++;}return {ok:ok,of:days}}
  /* days since the previous occurrence at or before ds */
  function gapAt(i,ds){for(var k=1;k<=90;k++){if(countOn(i,addDaysStr(ds,-k))>0)return k;}return null}
  function cleanStreak(i){var d=today(),c=0;while(c<3660&&countOn(i,d)===0){c++;d=addDaysStr(d,-1);}return c}
  function bestCleanStreak(i){
    var ds=Object.keys(i.events||{}).filter(function(d){return dCount(d)<=0}).sort();
    if(!ds.length){var since=dCount(i.createdDate||today());return Math.max(cleanStreak(i),Math.abs(since));}
    var best=0,prev=null;
    ds.forEach(function(d){if(prev){var g=dCount(d)-dCount(prev)-1;if(g>best)best=g;}prev=d;});
    var tail=cleanStreak(i);if(tail>best)best=tail;
    return best;
  }
  function lastSlip(i){var ds=Object.keys(i.events||{}).filter(function(d){return dCount(d)<=0}).sort();return ds.length?ds[ds.length-1]:null}
  function weekCount(i,ds){var n=0;for(var k=0;k<7;k++)n+=countOn(i,addDaysStr(ds||today(),-k));return n}

  /* ---- the five anomaly rules ---- */
  function anomaliesOn(i,ds){
    var out=[];if(!scannable(i)||dCount(ds)>0)return out;
    var N=normOf(i),c=countOn(i,ds);
    flagsOn(i,ds).forEach(function(f){var m=mkInfo(f);if(!m||m.t)return;out.push({k:"m:"+f,type:"marker",marker:f,sev:m.s});});
    var dr=driftOn(i,ds);if(dr)out.push({k:"time",type:"time",sev:"note",n:Math.abs(dr.mins),late:dr.mins>0});
    if(isLimit(i)){
      if(N.max!=null&&c>N.max)out.push({k:"slip",type:"slip",sev:"note",n:c});
      else if(N.week!=null&&weekCount(i,ds)>N.week)out.push({k:"week",type:"week",sev:"note",n:weekCount(i,ds)});
    } else {
      if(N.max!=null&&c>N.max)out.push({k:"high",type:"high",sev:"watch",n:c});
      if(N.min!=null&&c>0&&c<N.min)out.push({k:"low",type:"low",sev:"note",n:c});
      /* a gap only means something for body items — for routine work, a missed day is just a missed day,
         and the streak already says so */
      if(isBody(i)&&N.gap!=null&&c===0){var g=gapAt(i,ds);if(g!=null&&g>N.gap)out.push({k:"gap",type:"gap",sev:g>N.gap+1?"watch":"note",n:g});}
    }
    return out;
  }
  function anyAnomalyOn(i,ds){return anomaliesOn(i,ds).length>0}

  /* ---- escalation: a single odd day is noise. Persistence decides prominence. ---- */
  function maxConsec(dates){
    var s=dates.slice().sort(),best=0,cur=0,prev=null;
    s.forEach(function(d){if(prev&&dCount(d)-dCount(prev)===1)cur++;else cur=1;if(cur>best)best=cur;prev=d;});
    return best;
  }
  function levelFor(rec){
    var n=rec.n,sev=rec.sev,consec=maxConsec(rec.dates);
    /* a limit item that's trending down is good news, not an escalation */
    if(rec.type==="slip"||rec.type==="week"){
      if(rec.prev>0&&n<rec.prev)return "noted";
      if(n>=3&&n>rec.prev)return "persistent";
      return n>=2?"recurring":"noted";
    }
    /* a gap escalates by how LONG it ran, not how many days got flagged */
    if(rec.type==="gap"){
      var over=rec.peak-(normOf(rec.item).gap||1);
      if(over>=3)return "persistent";
      if(over>=1)return "recurring";
      return "noted";
    }
    if(sev==="urgent"&&n>=2)return "persistent";
    if(n>=3)return "persistent";
    if(rec.prev>0&&n>=2)return "persistent";
    if(n>=2||consec>=2)return "recurring";

  function exportDoctor(){
    var L=[],t0=today();
    L.push("RITSU \u2014 LOG SUMMARY");
    L.push("Prepared "+dayShort(t0)+" \u00b7 covers the last 30 days");
    L.push("A record of what was logged. It contains no diagnosis and no interpretation.");
    L.push("");
    var body=visibleItems().filter(isBody);
    if(body.length){L.push("BODY LOGS");
      body.forEach(function(i){
        var tot=0,days=0;for(var k=0;k<30;k++){var c=countOn(i,addDaysStr(t0,-k));tot+=c;if(c>0)days++;}
        var r=inRangeRatio(i,30);
        L.push("  "+i.title+" \u2014 "+tot+" logged over "+days+" of 30 days ("+rangeLabel(i)+"); in usual range "+r.ok+"/30");
        var fl={};for(var q=0;q<30;q++){var ds=addDaysStr(t0,-q);flagsOn(i,ds).forEach(function(f){(fl[f]=fl[f]||[]).push(ds)})}
        Object.keys(fl).forEach(function(f){L.push("      "+mkInfo(f).n+": "+fl[f].length+" day(s) \u2014 "+fl[f].slice(0,8).join(", "))});
      });L.push("");}
    var meds=visibleItems().filter(function(i){return i.kind==="med"});
    if(meds.length){L.push("MEDICATION");
      meds.forEach(function(i){var n=0;for(var k=0;k<30;k++)if(didOn(i,addDaysStr(t0,-k)))n++;
        L.push("  "+i.title+" \u2014 taken on "+n+" of the last 30 days ("+Math.round(n/30*100)+"%)"+((i.courseDays||0)>0?"; course "+i.courseDays+" days":""));});
      L.push("");}
    var eps=visibleItems().filter(isEpisode);
    if(eps.some(function(i){return epsOf(i).length})){L.push("EPISODES");
      eps.forEach(function(i){epsOf(i).slice(0,6).forEach(function(e){
        L.push("  "+i.title+" \u2014 "+epDays(e)+" day(s), "+epRange(e)+(e.end?"":" (ongoing)"));});});
      L.push("");}
    var fasts=visibleItems().filter(isFast);
    if(fasts.length){L.push("FASTING");
      fasts.forEach(function(i){var d=doneFasts(i).filter(function(f){return dCount(fmt(new Date(f.s)))>-30});
        if(d.length)L.push("  "+i.title+" \u2014 "+d.length+" fasts in 30 days, average "+(fastAvg(i,30)||0)+"h, longest "+Math.round(fastBest(i)*10)/10+"h");});
      L.push("");}
    var f7=patternScan(7).filter(function(r){return LV[r.level]>=2});
    if(f7.length){L.push("PATTERNS IN THE LAST 7 DAYS");
      f7.forEach(function(r){L.push("  ["+r.level+"] "+r.item.title+" \u2014 "+findingText(r).replace(/<[^>]+>/g,""))});
      L.push("");}
    L.push("Ritsu is a logbook, not a medical device.");
    return L.join("\n");
  }

  function cloneEvents(i){var o={};Object.keys(i.events||{}).forEach(function(d){o[d]=(i.events[d]||[]).map(function(e){return {t:e.t,flags:(e.flags||[]).slice(),scale:e.scale==null?null:e.scale,note:e.note||""}})});return o}
  function newEvent(ds){return {t:ds===today()?nowHM():null,flags:[],scale:null,note:""}}

  function addEvent(i,ds){var ev=cloneEvents(i);if(!ev[ds])ev[ds]=[];ev[ds].push(newEvent(ds));var extra={lastDone:ds};

  function setDayCount(i,ds,n){var ev=cloneEvents(i);var cur=(ev[ds]||[]).length;
    if(n<=0)delete ev[ds];else{if(!ev[ds])ev[ds]=[];while(ev[ds].length>n)ev[ds].pop();while(ev[ds].length<n)ev[ds].push(newEvent(ds));}
    var extra={};if(i.kind==="med"){var diff=(n<=0?0:n)-cur;extra.stock=Math.max(0,(i.stock||0)-diff*(i.dosesPerDay||1));}

  }
  function setScale(id,val,ds){
    var i=Store.get("items",id);if(!i)return;ds=ds||today();
    var ev=cloneEvents(i);var arr=ev[ds];if(!arr||!arr.length){ev[ds]=[newEvent(ds)];arr=ev[ds];}
    var e=arr[arr.length-1];e.scale=(e.scale===val?null:val);writeEvents(i,ev);
  }

  var _mt=null;
  function openStrip(id){state.mstrip=id;clearTimeout(_mt);_mt=setTimeout(function(){if(state.mstrip===id){state.mstrip=null;render();}},9000);}

  function logToggleDate(i,ds){ if(countOn(i,ds)>0)setDayCount(i,ds,0); else setDayCount(i,ds,1); }
  function tapTodo(i){
    if(!isRepeat(i)&&!isLimit(i)&&!isBody(i)){Store.update("items",i.id,{done:!i.done,completedAt:!i.done?new Date().toISOString():null});return;}
    if(isLimit(i)||isBody(i)){addEvent(i,today());openStrip(i.id);return;}   /* always adds — undo lives in the strip */
    var pd=Math.max(1,normOf(i).max||perDayOf(i));var c=countOn(i,today());
    if(c<pd){addEvent(i,today());openStrip(i.id);}else setDayCount(i,today(),0);
  }
  function backfillDate(i,ds){
    if(!scannable(i))return;
    if(isBody(i)||isLimit(i)){setDayCount(i,ds,countOn(i,ds)>0?0:1);return;}
    setDayCount(i,ds,countOn(i,ds)>0?0:1);
  }
  function toggleItem(id){var i=Store.get("items",id);if(!i)return;
    if(i.kind==="med"){if(isLimit(i)||isBody(i)){addEvent(i,today());openStrip(i.id);}else logToggleDate(i,today());}
    else if(i.kind==="todo")tapTodo(i);}

  $("#overlay").addEventListener("click",function(e){if(e.target===this)closeModal();});
  $("#fab").addEventListener("click",function(){if(state.view==="area")openItemEditor(null,state.areaId);else if(state.view==="day")openTask(null,state.day);else openTask(null,today());});
  $("#mSettings").addEventListener("click",function(){go("settings");});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("#overlay").classList.contains("show"))closeModal();});
  document.addEventListener("change",function(e){if(e.target&&e.target.id==="i-rep"){syncItem();renderItemModal();}});
  document.addEventListener("input",function(e){if(e.target&&e.target.id==="lib-q"&&ms.type==="library"){ms.q=e.target.value;renderLibrary();}});
  document.addEventListener("click",function(e){var el;
    if((el=e.target.closest("[data-theme-set]"))){applyTheme(el.getAttribute("data-theme-set"));render();return;}
    if((el=e.target.closest("[data-nav]"))){go(el.getAttribute("data-nav"));return;}
    if((el=e.target.closest("[data-day]"))){var v=parseInt(el.getAttribute("data-day"),10);state.day=v===0?today():addDaysStr(state.day,v);render();return;}
    if((el=e.target.closest("[data-report]"))){state.report=el.getAttribute("data-report");render();return;}
    if((el=e.target.closest("[data-tagf]"))){state.filterTag=el.getAttribute("data-tagf")||null;render();return;}
    if((el=e.target.closest("[data-back-area]"))){var ba=el.getAttribute("data-back-area");if(ba===TODO_CAT)go("day");else go("area",ba);return;}
    if((el=e.target.closest("[data-area]"))&&!e.target.closest("[data-action]")){go("area",el.getAttribute("data-area"));return;}
    if((el=e.target.closest("[data-toggle]"))){e.stopPropagation();toggleItem(el.getAttribute("data-toggle"));return;}
    if((el=e.target.closest("[data-measure]"))){e.stopPropagation();openMeasure(el.getAttribute("data-measure"));return;}
    if((el=e.target.closest("[data-reset]"))){e.stopPropagation();Store.update("items",el.getAttribute("data-reset"),{lastDone:today()});toast("Done");return;}
    if((el=e.target.closest("[data-restock]"))){e.stopPropagation();openRestock(el.getAttribute("data-restock"));return;}
    if((el=e.target.closest("[data-backfill]"))){e.stopPropagation();var p=el.getAttribute("data-backfill").split("|");backfillDate(Store.get("items",p[0]),p[1]);return;}
    if((el=e.target.closest("[data-ep]"))){e.stopPropagation();var epi=Store.get("items",el.getAttribute("data-ep"));if(epi){if(activeEp(epi)){var dd0=epDays(activeEp(epi));endEpisode(epi);state.mstrip=null;toast("Ended after "+dd0+" days");}else{startEpisode(epi);openStrip(epi.id);}}return;}
    if((el=e.target.closest("[data-epmarker]"))){e.stopPropagation();var ep2=el.getAttribute("data-epmarker").split("|");var ei=Store.get("items",ep2[0]);if(ei)toggleEpFlag(ei,ep2[1]);openStrip(ep2[0]);return;}
    if((el=e.target.closest("[data-marker]"))){e.stopPropagation();var mp=el.getAttribute("data-marker").split("|");attachMarker(mp[0],mp[1]);openStrip(mp[0]);return;}
    if((el=e.target.closest("[data-scalecycle]"))){e.stopPropagation();var sid=el.getAttribute("data-scalecycle");var si=Store.get("items",sid);var c0=((evOn(si,today()).slice(-1)[0])||{}).scale||0;var nx=c0>=7?null:c0+1;
      if(nx===null){setScale(sid,c0);}else{var ev0=cloneEvents(si);var ar0=ev0[today()];if(!ar0||!ar0.length){ev0[today()]=[newEvent(today())];ar0=ev0[today()];}ar0[ar0.length-1].scale=nx;writeEvents(si,ev0);}
      openStrip(sid);return;}
    if((el=e.target.closest("[data-undo]"))){e.stopPropagation();var ui=Store.get("items",el.getAttribute("data-undo"));if(ui)removeEvent(ui,today());state.mstrip=null;clearTimeout(_mt);return;}
    if((el=e.target.closest("[data-open]"))){go("item",el.getAttribute("data-open"));return;}
    if((el=e.target.closest("[data-action]"))){var a=el.getAttribute("data-action");if(a==="add-cat")openCatEditor(null);else if(a==="edit-cat")openCatEditor(el.getAttribute("data-id"));else if(a==="add-item")openItemEditor(null,el.getAttribute("data-cat"));else if(a==="add-day")openTask(null,el.getAttribute("data-date"));else if(a==="edit-item")openItemEditor(el.getAttribute("data-id"));else if(a==="add-person")openPersonEditor();else if(a==="pick-me")openMePicker();else if(a==="add-tag")openTagEditor();else if(a==="pick-flag")openFlagPicker();else if(a==="library")openLibrary(el.getAttribute("data-cat"));else if(a==="export")openExport("doctor");
      else if(a==="reseed"){if(confirm("Wipe this device and reload with fresh sample data?")){try{localStorage.removeItem("ritsu_local");localStorage.removeItem("ritsu_private_items");localStorage.removeItem("ritsu_me");localStorage.removeItem("ritsu_probe_day");}catch(x){}location.reload();}}
      return;}
    if((el=e.target.closest("[data-setme]"))){state.me=el.getAttribute("data-setme");try{localStorage.setItem("ritsu_me",state.me)}catch(x){}closeModal();render();return;}
    if((el=e.target.closest("[data-del-person]"))){var pid=el.getAttribute("data-del-person");var pn=personById(pid);if(confirm("Remove "+(pn?pn.name:"this person")+"?")){Store.del("people",pid);Store.all("items").forEach(function(i){if((i.assignees||[]).indexOf(pid)>-1)Store.update("items",i.id,{assignees:i.assignees.filter(function(x){return x!==pid})});});if(state.me===pid){state.me=null;try{localStorage.removeItem("ritsu_me")}catch(x){}}}return;}
    if((el=e.target.closest("[data-del-tag]"))){var tid=el.getAttribute("data-del-tag");if(confirm("Delete this tag?")){Store.del("tags",tid);Store.all("items").forEach(function(i){if((i.tags||[]).indexOf(tid)>-1)Store.update("items",i.id,{tags:i.tags.filter(function(x){return x!==tid})});});}return;}
    if((el=e.target.closest("#i-stance button"))){syncItem();var sv=el.getAttribute("data-v");ms.data.stance=sv;ms.data.markers=[];
      if(sv==="body")ms.data.normal={min:1,max:2,maxGapDays:2,maxPerWeek:null};
      else if(sv==="limit")ms.data.normal={min:null,max:0,maxGapDays:null,maxPerWeek:null};
      else ms.data.normal={min:ms.data.perDay||1,max:ms.data.perDay||1,maxGapDays:ms.data.repeatEvery||1,maxPerWeek:null};
      if(sv!=="routine"){ms.data.private=true;ms.data.localOnly=true;}
      renderItemModal();return;}
    if((el=e.target.closest("[data-mtoggle]"))){syncItem();var mf=el.getAttribute("data-mtoggle");var cm=(ms.data.markers||[]).slice();
      var mi=cm.indexOf(mf);if(mi>-1)cm.splice(mi,1);else cm.push(mf);
      ms.data.markers=cm;renderItemModal();return;}
    if((el=e.target.closest("[data-see]"))){syncItem();var sv=el.getAttribute("data-see");ms.data.private=(sv!=="shared");ms.data.localOnly=(sv==="device");if(ms.mode==="task")renderTaskModal();else renderItemModal();return;}
    if((el=e.target.closest("[data-exp]"))){openExport(el.getAttribute("data-exp"));return;}
    if(e.target.closest("[data-expcopy]")){var ta=$("#exp-t");if(ta){ta.select();
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){toast("Copied")},function(){toast("Select the text and copy")});}
      else{try{document.execCommand("copy");toast("Copied")}catch(x){toast("Select the text and copy")}}}return;}
    if((el=e.target.closest("[data-faststart]"))){e.stopPropagation();var fi=Store.get("items",el.getAttribute("data-faststart"));if(fi){startFast(fi);toast("Fast started");}return;}
    if((el=e.target.closest("[data-fastend]"))){e.stopPropagation();var fj=Store.get("items",el.getAttribute("data-fastend"));if(fj){var hrs=endFast(fj);toast("Logged \u2014 "+fmtHM(hrs));}return;}
    if((el=e.target.closest("[data-fastproto]"))){e.stopPropagation();openProtocol(el.getAttribute("data-fastproto"));return;}
    if((el=e.target.closest("[data-protopick]"))){var pv0=parseInt(el.getAttribute("data-protopick"),10);
      if(pv0>=24&&!extAcked()){ms.askExt=pv0;renderProtocol();return;}
      setProtocol(ms.id,pv0);return;}
    if(e.target.closest("[data-protocustom]")){var ph=$("#pt-h");var pv1=ph?parseInt(ph.value,10):16;
      if(pv1>=24&&!extAcked()){ms.askExt=pv1;renderProtocol();return;}
      setProtocol(ms.id,pv1);return;}
    if((el=e.target.closest("[data-extok]"))){ackExt();var pv2=parseInt(el.getAttribute("data-extok"),10);ms.askExt=null;setProtocol(ms.id,pv2);return;}
    if(e.target.closest("[data-extback]")){ms.askExt=null;renderProtocol();return;}
    if((el=e.target.closest("[data-probe]"))){var pp=el.getAttribute("data-probe").split("|");answerProbe(pp[0],pp[1],pp[2]);toast("Noted");return;}
    if(e.target.closest("[data-probeskip]")){markProbeAsked();state.probeHide=true;render();return;}
    if((el=e.target.closest("[data-lib]"))){var pr=el.getAttribute("data-lib").split("|");var tpl=LIBRARY[+pr[0]].items[+pr[1]];
      var cid=ms.cat||state.areaId||((cats().filter(function(c){return c.id!==TODO_CAT})[0])||{}).id;
      ms={type:"item",mode:"area",id:null,data:libToData(tpl,cid),ask:tpl.ask||null};renderItemModal();return;}
    if((el=e.target.closest("[data-flagpick]"))){toggleFlagPick(el.getAttribute("data-flagpick"));return;}
    if((el=e.target.closest("#nf-sev button"))){ms.nf.severity=el.getAttribute("data-v");renderFlagModal();return;}
    if(e.target.closest("[data-save-flag]")){saveNewFlag();return;}
    if(e.target.closest("[data-flagdone]")){closeFlagPicker();return;}
    if((el=e.target.closest("[data-del-marker]"))){var mid=el.getAttribute("data-del-marker");if(confirm("Delete this flag?")){Store.del("markers",mid);Store.all("items").forEach(function(i){if((i.markers||[]).indexOf(mid)>-1)Store.update("items",i.id,{markers:i.markers.filter(function(x){return x!==mid})});});}return;}
    if((el=e.target.closest("#i-akind button"))){syncItem();ms.data.akind=el.getAttribute("data-v");renderItemModal();return;}
    if((el=e.target.closest("#i-mode button"))){ms.data.mode=el.getAttribute("data-v");renderItemModal();return;}
    if((el=e.target.closest("[data-protoset]"))){syncItem();var pv=parseInt(el.getAttribute("data-protoset"),10);ms.data.protocol={fast:pv,eat:24-pv};renderItemModal();return;}
    if((el=e.target.closest("#i-exdir button"))){syncItem();if(ms.data.expect)ms.data.expect.dir=el.getAttribute("data-v");renderItemModal();return;}
    if((el=e.target.closest("#i-prio button"))){ms.data.priority=el.getAttribute("data-v");if(ms.mode==="task")renderTaskModal();else renderItemModal();return;}
    if((el=e.target.closest("[data-tagtoggle]"))){syncItem();var tt=el.getAttribute("data-tagtoggle");var ar=ms.data.tags||[];var ix2=ar.indexOf(tt);if(ix2>-1)ar.splice(ix2,1);else ar.push(tt);ms.data.tags=ar;if(ms.mode==="task")renderTaskModal();else renderItemModal();return;}
    if((el=e.target.closest("#i-assign .pick"))){syncItem();var pd=el.getAttribute("data-pid");var a2=ms.data.assignees||[];var ix3=a2.indexOf(pd);if(ix3>-1)a2.splice(ix3,1);else a2.push(pd);ms.data.assignees=a2;if(ms.mode==="task")renderTaskModal();else renderItemModal();return;}
    if((el=e.target.closest("#c-emoji button"))){ms.data.emoji=el.getAttribute("data-v");renderCatModal();return;}
    if((el=e.target.closest("#c-color button"))){ms.data.color=el.getAttribute("data-v");renderCatModal();return;}
    if((el=e.target.closest("#tg-color button"))){ms.data.color=el.getAttribute("data-v");renderTagModal();return;}
    if((el=e.target.closest("#pp-emoji button"))){ms.data.emoji=el.getAttribute("data-v");renderPersonModal();return;}
    if((el=e.target.closest("#pp-color button"))){ms.data.color=el.getAttribute("data-v");renderPersonModal();return;}
    if(e.target.closest("[data-close]")){closeModal();return;}
    if(e.target.closest("[data-save-item]")){saveItem();return;}
    if((el=e.target.closest("[data-del-item]"))){if(confirm("Delete this item?")){var it=Store.get("items",el.getAttribute("data-del-item"));Store.del("items",el.getAttribute("data-del-item"));closeModal();if(state.view==="item"){state.view=it&&it.catId===TODO_CAT?"day":"area";state.areaId=it?it.catId:null;render();}}return;}
    if(e.target.closest("[data-save-cat]")){saveCat();return;}
    if((el=e.target.closest("[data-del-cat]"))){var cid=el.getAttribute("data-del-cat");var its=itemsOf(cid);if(confirm("Delete this area"+(its.length?" and its "+its.length+" items":"")+"?")){its.forEach(function(i){Store.del("items",i.id)});Store.del("cats",cid);closeModal();if(state.view==="area"&&state.areaId===cid)state.view="home";render();}return;}
    if(e.target.closest("[data-save-tag]")){saveTag();return;}
    if(e.target.closest("[data-save-person]")){savePerson();return;}
    if((el=e.target.closest("[data-save-measure]"))){saveMeasure(el.getAttribute("data-save-measure"));return;}
    if((el=e.target.closest("[data-clear-measure]"))){clearMeasure(el.getAttribute("data-clear-measure"));return;}
    if((el=e.target.closest("[data-save-restock]"))){saveRestock(el.getAttribute("data-save-restock"));return;}
  });
  setInterval(function(){
    if($("#overlay").classList.contains("show"))return;
    if(!Store.ready||!anyActiveFast())return;
    if(state.view==="home"||state.view==="item"||state.view==="area")render();
  },30000);
  Store.onChange=function(){render();};Store.init();
})();
</script>

/* Offline support. Registered last so a failure here can never block the app. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
